# RocketMQ broker 配置模板（本地开发）
#
# 使用前必须替换 __BROKER_IP__：WSL2 的 NAT 模式下，broker 向 namesrv 注册的地址必须是
# **客户端可达**的地址，而 Windows 侧客户端只能访问 WSL 的 eth0 IP，不能访问容器内网或 docker0。
# 生成运行时副本（在 WSL2 内执行）：
#   sed "s/__BROKER_IP__/$(hostname -I | awk '{print $1}')/" \
#     <repo>/docs/00-infra/rocketmq-broker.conf > /opt/docqa-infra/broker.conf
# 漏了这一步的典型症状：producer 启动正常、发送时报 connect to 172.17.0.1:10911 timeout。

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
deleteWhen = 04
fileReservedTime = 48

brokerIP1 = __BROKER_IP__
listenPort = 10911
namesrvAddr = 127.0.0.1:9876

# 本地开发打开自动建组与自动建 topic；生产必须关闭并由运维预建，
# 否则第一条消息落在默认的 TBW102 模板上，队列数与读写权限都不可控。
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 本地单 broker，测试 topic 与重试队列都落在同一 broker
defaultTopicQueueNums = 4
retryTopicQueueNums = 2

# 教学项目消息体积小、量大在本地不存在，收紧以适配 1.5G 堆外内存预算
mappedFileSizeCommitLog = 134217728
transientStorePoolEnable = false

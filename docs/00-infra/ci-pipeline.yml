# GitHub Actions 门禁清单（说明性文件，不是可执行工作流）
#
# 唯一可执行的定义在 .github/workflows/ci.yml —— 不要把本文件复制成 workflow，
# 否则两份配置必然漂移（历史教训：本文件曾要求 Java Quality Gate，而真实 CI 只有
# 一个 mvn verify 作业，按文档去配 required check 会永远等不到状态回报）。
#
# 本地等价命令：scripts/verify-all.sh / scripts/verify-all.ps1 -Offline

gates:
  - job: "Java 17 / mvn verify"
    workflow: ".github/workflows/ci.yml"
    working_directory: "backend-java"
    command: "mvn -B -ntp verify"
    covers:
      - "编译 + 单元测试 + Checkstyle + ArchUnit（checkstyle 绑定 verify，ArchUnit 在 test 阶段）"
    required_status_check: "Java 17 / mvn verify"

  - job: "Python 3.12 / pytest + ruff"
    workflow: ".github/workflows/ci.yml"
    working_directory: "ai-python"
    commands:
      - "ruff check ."
      - "ruff format --check ."
      - "pytest -p no:warnings -q"
    required_status_check: "Python 3.12 / pytest + ruff"

  - job: "Node 22 / typecheck + lint + test + build"
    workflow: ".github/workflows/ci.yml"
    working_directory: "frontend-vue"
    commands:
      - "npm ci"
      - "npm run typecheck"
      - "npm run lint"
      - "npm run test"
      - "npm run build"
    required_status_check: "Node 22 / typecheck + lint + test + build"

# 只跑 ArchUnit 的本地命令（CI 不需要，verify 已经覆盖）。
# mq-support 没有 *ArchitectureTest，Surefire 默认 failIfNoSpecifiedTests=true，
# 漏掉这个 flag 会让该模块以 "No tests matching pattern" 失败。
local_archunit_command: >-
  cd backend-java && mvn -B -ntp -Dtest='*ArchitectureTest'
  -Dsurefire.failIfNoSpecifiedTests=false test

# 拦截的是什么问题：拦截未经编译、测试、风格检查和架构校验的代码进入主干，
# 避免“本地能跑”变成合并后的系统性故障。

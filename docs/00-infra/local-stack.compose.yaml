# 本地开发中间件编排（RocketMQ / PostgreSQL+PGVector / MinIO）
#
# 用途：为 S0「后端 Java 运行时验证」提供真实中间件，替代此前的 msw 仿真与离线 Provider。
# 约束：
#   - 本文件不含任何凭据。所有密钥经 --env-file 注入，env 文件放在仓库外。
#   - 全部使用 network_mode: host，因为 WSL2 的 NAT 模式下宿主机(Windows)可直接访问 WSL 网卡 IP；
#     RocketMQ broker 需要向 namesrv 注册一个**客户端可达**的地址，host 网络下它自动探测到的就是该 IP，
#     若改用 bridge + 端口映射，broker 会注册容器内网 IP，Windows 侧客户端拿到地址后连不上。
#   - 端口避让：Milvus standalone 的 compose 已占用宿主机 9000/9001（它自带的 MinIO），
#     因此本文件的 MinIO 使用 9100/9101。
#
# 启动（在 WSL2 Ubuntu 内）：
#   docker compose -f <repo>/docs/00-infra/local-stack.compose.yaml \
#     --env-file /opt/docqa-infra/.env up -d
# 注意：正常路径是由 prepare-local-stack.sh 渲染到 /opt/docqa-infra/ 再启动；
# 手工执行时 env 文件也必须在 /opt 下，不能放 ~/docqa-infra（dockerd 的 HOME=/root 是 700）。
# 内存预算：namesrv 768M + broker 1.5G + pg 512M + minio 512M ≈ 3.3G。

name: docqa-infra

services:
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: docqa-rmq-namesrv
    network_mode: host
    command: sh mqnamesrv
    environment:
      # runbroker/runserver 把 JAVA_OPT_EXT 追加在默认参数之后，JVM 取最后一次出现者，故可覆盖默认堆大小
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    volumes:
      - rmq-namesrv-logs:/home/rocketmq/logs
    mem_limit: 768m
    restart: unless-stopped

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: docqa-rmq-broker
    network_mode: host
    command: sh mqbroker -c /opt/rocketmq/conf/broker.conf
    depends_on:
      - rocketmq-namesrv
    environment:
      JAVA_OPT_EXT: "-Xms1g -Xmx1g -Xmn512m"
      NAMESRV_ADDR: "127.0.0.1:9876"
    volumes:
      - ${DOCQA_INFRA_DIR}/broker.conf:/opt/rocketmq/conf/broker.conf:ro
      - rmq-broker-store:/home/rocketmq/store
    mem_limit: 1536m
    restart: unless-stopped

  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: docqa-pg
    network_mode: host
    environment:
      POSTGRES_USER: docqa
      POSTGRES_DB: docqa_vec
      POSTGRES_PASSWORD: ${DOCQA_PG_PASSWORD}
      # 本地开发单机，关闭同步提交换取写入延迟；生产不得沿用
      SYNCHRONOUS_COMMIT: "off"
    volumes:
      - pg-data:/var/lib/postgresql/data
    mem_limit: 512m
    restart: unless-stopped

  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: docqa-minio
    network_mode: host
    command: server /data --address ":9100" --console-address ":9101"
    environment:
      MINIO_ROOT_USER: ${DOCQA_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${DOCQA_MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    mem_limit: 512m
    restart: unless-stopped

volumes:
  rmq-namesrv-logs:
  rmq-broker-store:
  pg-data:
  minio-data:

        kind:
          $ref: '#/components/schemas/ReminderKind'
        status:
          $ref: '#/components/schemas/ReminderStatus'
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 1000
          nullable: true
        rrule:
          type: string
          maxLength: 1024
        dtstart:
          type: string
          format: date-time
        timezone:
          type: string
          maxLength: 64
        exdates:
          type: array
          maxItems: 365
          items:
            type: string
            format: date-time
          description: 空数组表示无排除日；`reminder.exdates` 为 NULL 时同样返回空数组。
        leadMinutes:
          type: integer
          minimum: 0
          maximum: 10080
          description: |
            作用在 occurrence 上的提前量（分钟），即 `nextTriggerAt = occurrence - leadMinutes`。
            **`COURSE` 行取库内 `reminder.lead_minutes`；`DEADLINE` 与 `CUSTOM` 行恒为 0**——
            创建截止提醒时提前量已经并进 `dtstart`（`dueAt - leadMinutes` 才是存下来的时刻），
            事后无法反推，硬报一个非零值等于承诺一个并不存在的提前量。
            因此界面只在 `kind=COURSE` 时显示「提前 N 分钟」徽章。
            上限 10080（七天）与写入面逐字相同：`ReminderListItemData` 原样投影 `lead_minutes` 列，
            而课表导入与截止创建都允许到 10080，读侧写 1440 会把一次合法的「提前两天」导入
            读成非法响应（由前端契约对账测试发现并更正；读侧与写入面的上限必须逐字一致）。
        nextTriggerAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Java 按 RRULE/EXDATE 计算的下一次触发时间；为 null 表示该提醒不再触发，
            在看板中稳定排在末尾组。
        lastTriggeredAt:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          format: int64
          minimum: 0
          description: 乐观并发版本，供后续编辑接口使用。
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReminderListData:

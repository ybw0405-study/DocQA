  /api/v1/reminders/ics/import:
    post:
      tags:
        - Reminders
      operationId: importSchedule
      summary: 整批导入 ICS 课表为重复提醒规则
      description: |
        把同一份 ICS 落库：一个 `VEVENT` 一行提醒，`source_type = COURSE`、
        `source_uid = <UID>`、`source_sequence = <SEQUENCE>`，**禁止按 occurrence 拆行**。
        判定与预览使用同一套规则，但**以本操作的判定为准**（见预览操作说明）。

        - **整批一个事务**：解析失败、字段非法、SQL 异常都使整批回滚，
          不存在「前半套课表已写入」的中间状态。
        - `STALE` 事件（文件 `SEQUENCE` 低于库内值）**不阻断整批**，只跳过并计入 `staleCount`；
          这是刻意的：教务系统重新导出整个学期时，绝大多数课的 SEQUENCE 不变，
          若把「没有变化」当冲突，重复导入就会稳定失败。
        - 不删除文件里已消失的旧课程。删除需要「本次集合 vs 库内集合」的差集判断，
          而课表导出可能是部分学期、可能按周筛选，据此自动删除会误删仍在上的课；
          逐条取消入口属于 S4。
        - 幂等：`operation = SCHEDULE_IMPORT`，请求指纹为
          `sha256(文件 SHA-256 | fallbackTimezone | leadMinutes)`；同 key 同指纹重放返回首次结果
          并把 `idempotentReplay` 置 `true`，同 key 不同指纹返回 409 `REM-CONFLICT-001`。
          落库的 `idempotency_key` 是 `sha256hex(requestKey | uid)`，因为一次导入涉及多行。
        - **重放只还原计数摘要**：`idempotentReplay = true` 时 `items` 恒为空数组，
          四类计数与 `itemCount` 保持首次结果不变。幂等记录存在 Redis 里，500 个事件的项目明细
          约为摘要的百倍，把它们存下来只为了重放时再展示一遍已经完成的判定不值得；
          调用方需要明细时重新调用预览，明细的正确来源是「库内状态 + 文件」，而不是历史响应。
        - 与 `POST /api/v1/reminders` 的唯一键交错：并发导入同一 UID 时，
          `uk_reminder_user_source` 命中返回 409 `REM-CONFLICT-002`，整批回滚，重试即可。
        - 只写 MySQL，不投递 MQ、不调用 Python：课表行与手工创建的规则同构，
          触发时刻由既有调度器按 `next_trigger_at` 物化列扫表得到。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScheduleImportRequest'
      responses:
        '201':
          description: 导入成功，整批已提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleImportEnvelope'
              examples:
                imported:
                  summary: 新建 1 条、更新 1 条、陈旧跳过 1 条
                  value:
                    code: OK
                    msg: success
                    data:
                      itemCount: 3
                      createCount: 1
                      updateCount: 1
                      unchangedCount: 0
                      staleCount: 1
                      idempotentReplay: false
                      fallbackTimezone: Asia/Shanghai
                      leadMinutes: 10
                      items:
                        - uid: linear-algebra-2026-fall-mon-0800
                          summary: 线性代数
                          sequence: 3
                          currentSequence: null
                          action: CREATE
                          dtstart: '2026-09-07T00:00:00Z'
                          timezone: Asia/Shanghai
                          rrule: FREQ=WEEKLY;BYDAY=MO;UNTIL=20270110T155959Z
                          exdates:
                            - '2026-10-05'
                          nextTriggerAt: '2026-09-06T23:50:00Z'
                          followingTriggerAt: '2026-09-13T23:50:00Z'
                          reminderId: 0192f3a4-7b2c-7d10-9e8f-1234567890ae
                        - uid: advanced-programming-tue-1400
                          summary: 高级程序设计
                          sequence: 5
                          currentSequence: 4
                          action: UPDATE

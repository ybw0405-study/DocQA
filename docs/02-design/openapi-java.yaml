                renamed:
                  value:
                    code: OK
                    msg: success
                    data:
                      documentId: 0192f3a4-9d4e-7f32-8a01-1234567890ab
                      fileName: calculus-notes.pdf
                      title: 高等数学·第三章笔记
                      tags:
                        - 考研数学
                      status: INDEXED
                      retryCount: 0
                      maxRetry: 3
                      errorCode: null
                      errorMessage: null
                      indexVersion: v1
                      pendingIndexVersion: null
                      chunkCount: 42
                      vectorRows: 42
                      vectorConfirmedAt: '2026-10-30T06:20:11Z'
                      vectorConsistency: MATCHED
                      indexedAt: '2026-10-20T10:17:12Z'
                      createdAt: '2026-10-20T10:15:50Z'
                      updatedAt: '2026-10-30T06:20:11Z'

  /api/v1/conversations/{conversationId}/ask:
    post:
      tags:
        - Conversations
      operationId: askConversation
      summary: 基于已授权文档发起问答
      description: |
        校验会话归属、文档所有权和 `INDEXED` 状态，读取最近上下文，执行预算治理的 RAG 问答。
        `documentIds` 只能是当前用户拥有的文档；混入无权文档时返回 404，不进入 Python。

        首次提问自动建会话：若 `conversationId` 尚未落库，服务端会在通过文档归属校验后
        为当前用户创建该 ID 的空会话，再继续问答；若该 ID 已被其他用户占用则返回 404。
        并发场景下创建冲突会被识别并回退为归属检查，不会覆盖既有会话。

        幂等：`Idempotency-Key` 写入 `message.client_request_id`，作用域为 `conversationId + key`。
        同一 key 且问题相同：已有结果时返回原结果（`idempotentReplay=true`），仍在执行时返回 409。
        同一 key 但问题或文档范围不同返回 409。缓存命中不等同于幂等，仍会写 `agent_execution`。

        Python 不可用返回 503；15 秒内未返回返回 504；Kill Switch 打开返回 503 `AGT-UPSTREAM-003`。
        低置信度和预算耗尽仍返回 200，通过 `data.budgetStatus` 区分。
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
            examples:
              askWithOneDocument:
                summary: 针对一份文档提问
                value:
                  question: 请解释第三章的梯度下降，并举一个例子。
                  documentIds:
                    - 0192f3a4-9d4e-7f32-8a01-1234567890ab

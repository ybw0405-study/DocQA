  /api/v1/conversations/{conversationId}/ask:stream:
    post:
      tags:
        - Conversations
      operationId: askConversationStream
      summary: 基于已授权文档发起流式问答（SSE）
      description: |
        与非流式 `POST …/ask` 共享同一治理管线（会话归属、文档授权、幂等、限流、日配额、Kill Switch、
        PII 双层脱敏、QA 缓存、审计与落库），区别仅在回答文本的传输形态：成功时响应为
        `text/event-stream` 事件流，事件协议为「四帧序列」：

        - `meta`：恰好一帧，流首下发。`messageId` 在流首即固定，客户端本地消息行从第一刻起
          即可与服务端历史对上；`cacheHit` 让缓存命中的流在首帧即被识别。
        - `delta`：0..n 帧，`data.text` 为**纯增量**文本（非快照），客户端按序拼接只做渲染。
        - `done`：恰好一帧，流末下发，`data` 为完整 `AskData` 同构字段 + `traceId`。
          字段真源以 `done` 帧为准，客户端应以它整体替换本地拼接态。
        - `error`：至多一帧，仅在 `meta` 帧已经下发之后才可能到达（替代 `done`），
          `data` 为 ProblemDetail 同构（status / code / detail / traceId），其后流正常关闭。

        事件帧的线上形态为 SSE 标准帧：`event: <名称>` 行 + `data: <JSON>` 行 + 空行；
        本契约的 schema 描述的是 `data` 载荷与 `event` 名称的组合。检索等长间隔期间
        服务端可能下发 SSE 注释行（`: keep-alive`），客户端解析必须忽略注释行。

        **治理拒绝不升级 SSE**：校验失败、限流 / 配额 429、Kill Switch、幂等冲突、Python 不可达等
        一切发生在首个事件帧**之前**的拒绝，响应就是普通 JSON ProblemDetail（错误码与非流式操作
        完全一致，429 同样携带 `Retry-After`），Content-Type 仍为 `application/problem+json`。
        只有 `meta` 帧已经下发之后的失败才以 `error` 帧表达。

        幂等重放：同一 `Idempotency-Key` 且指纹匹配的 COMPLETED 记录**不重放 delta 序列**，
        直接下发 `meta` + 单条 `done`（答案全文在 `done.data.answer`），`idempotentReplay=true`。
        断线语义：客户端断开连接即取消上游生成；已计入的当日问答配额**不退还**（准入即计数）。

        Python 不可用返回 503；15 秒内未首响返回 504；低置信度与预算耗尽仍正常走完
        `meta` → `delta` → `done`，由 `done.data.budgetStatus` 区分。
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
      responses:
        '200':
          description: |
            SSE 事件流；帧序恒为 `meta` → `delta`… → `done` 或 `meta` → `delta`… → `error`，
            两种序列都恰有一个终止帧，流在终止帧后关闭。

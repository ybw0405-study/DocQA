  /api/v1/documents/{documentId}/retry:
    post:
      tags:
        - Documents
      operationId: retryDocumentParse
      summary: 手动重试失败的解析任务
      description: |
        为 `FAILED` 或 `DEAD` 状态的文档重新发起解析。返回 202 表示解析请求已进入异步投递。

        **只允许 `FAILED` 与 `DEAD`**。`UPLOADED` 不开放手动重试：它是「上传已完成但解析尚未开始」的
        正常中间态，由对账任务在分钟内补投，把它做成按钮会给用户一个语义不明的入口。
        `PARSING` 与 `INDEXED` 重试无意义且会重复消耗 embedding 成本，返回 409 `DOC-CONFLICT-001`。

        重试沿用**同一 `indexVersion`** 并把 `retry_count` 归零：
        沿用版本才让 Python 侧与 MySQL 侧的幂等键 `(documentId, indexVersion)` 继续生效，重复投递只是重写同一批向量；
        归零是因为「手动重试」代表人已处理完前置条件（例如解除 PDF 密码），应当重新获得一整轮预算，
        而不是从上次耗尽处继续累加——`retry_count <= max_retry` 的约束下不归零的话 `DEAD` 文档永远重试不了。

        本接口真实触发解析与 embedding 调用，因此受用户级限流；客户端必须把 429 当成「稍后再试」而不是错误终态。
        幂等重放（同 key 同指纹）返回 200 并回显当前状态，不重复投递。
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: 解析请求已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStatusEnvelope'
              examples:
                accepted:
                  value:
                    code: OK
                    msg: success
                    data:
                      documentId: 0192f3a4-9d4e-7f32-8a01-1234567890ab
                      fileName: encrypted-lecture.pdf
                      title: null
                      tags: []
                      status: PARSING
                      retryCount: 0
                      maxRetry: 3
                      errorCode: null
                      errorMessage: null
                      indexVersion: v1
                      pendingIndexVersion: null
                      chunkCount: 0
                      vectorRows: null
                      vectorConfirmedAt: null
                      vectorConsistency: UNKNOWN
                      indexedAt: null
                      createdAt: '2026-10-19T08:03:11Z'
                      updatedAt: '2026-10-30T06:31:02Z'
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '200':
          description: 幂等重放，返回当前状态，未重复投递
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStatusEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '409':
          $ref: '#/components/responses/DocumentConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/documents/{documentId}/reindex:
    post:
      tags:
        - Documents
      operationId: reindexDocument
      summary: 在新索引版本上重建文档向量
      description: |
        为已索引文档重建一份**新版本**的向量，返回 202 表示重建请求已进入异步投递。

        与 `retry` 是两件事，因此是两个接口而不是一个带参数的接口：`retry` 是「同一版本上把失败的那一步再跑一遍」，
        不改变可检索内容；`reindex` 是「换一份 embedding 模型或分块策略后重新构建」，必须先让新版本可用
        再删旧版本，否则一旦新索引失败，文档会从检索里整个消失。

        **双版本共存**是这里的取舍：服务端把目标版本 `v{n+1}` 写入 `pending_index_version` 后投递
        `parse-requested`，期间 `status` **保持 `INDEXED`**、`index_version` 指向的旧版本继续可检索——
        问答的检索范围要求文档是 `INDEXED`，若在途期间改成 `PARSING`，重建本身就会让文档短暂变成「问不了」，
        这正是双版本共存要避免的退化；因此在途与否只看 `pendingIndexVersion` 是否为空。
        `parse.completed` 只有命中 `pending_index_version` 才推进 `index_version`、清空该列，并在同一提交后删除旧版本的 `chunk` 行、
        投递 `vector-change-requested`（`operation=DELETE_VERSION`、`indexVersion=旧`）。
        重建**失败或超时**同样只清空 `pending_index_version` 并写入 `errorCode`/`errorMessage`，`status` 保持 `INDEXED`：
        旧版本从未被删除，把它降级成 `FAILED` 会让一个仍可正常问答的文档变成不可用。
        版本号由服务端从当前值推导，**不接受客户端传入**——让客户端指定版本等于允许它写一个与序列无关的字符串，
        之后所有幂等键和缓存键都会失真。

        只允许 `status=INDEXED` 且 `pending_index_version IS NULL` 的文档。已有重建在途时返回 409，
        因为两个并发重建会各写一个 pending，推进时无法判定哪个版本才是该留下来的。
        重建真实消耗 embedding 调用，受用户级限流；旧版本清理失败或投递丢失**不会让文档不可用**：
        残留的旧版本向量不在 `index_version` 指向的版本里，检索按当前版本过滤因而永远命中不到，
        `vectorConsistency` 仍按新版本对照（不会因此变成 `DIVERGED`）。本期的补投只覆盖软删除，
        这类跨库孤儿行的巡检属运维面（S9）。幂等重放返回 200 并回显当前状态。
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: 重建请求已受理，旧版本仍可检索
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStatusEnvelope'
              examples:
                accepted:
                  value:
                    code: OK
                    msg: success
                    data:
                      documentId: 0192f3a4-9d4e-7f32-8a01-1234567890ab
                      fileName: calculus-notes.pdf
                      title: 高等数学·第三章笔记
                      tags:
                        - 考研数学
                      status: INDEXED
                      retryCount: 0
                      maxRetry: 3
                      errorCode: null
                      errorMessage: null
                      indexVersion: v1
                      pendingIndexVersion: v2
                      chunkCount: 42
                      vectorRows: 42
                      vectorConfirmedAt: '2026-10-20T10:17:12Z'
                      vectorConsistency: MATCHED
                      indexedAt: '2026-10-20T10:17:12Z'
                      createdAt: '2026-10-20T10:15:50Z'
                      updatedAt: '2026-10-30T06:40:00Z'
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '200':
          description: 幂等重放，返回当前状态，未重复投递
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStatusEnvelope'

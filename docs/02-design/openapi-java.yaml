      operationId: updateAiQuota
      summary: 全量替换某用户的 AI 日配额
      description: |
        需要 `ADMIN` 角色。请求体的两个字段都必须出现（可显式为 `null`）：

        - 数值表示该维度当日上限，按 UTC 自然日计；

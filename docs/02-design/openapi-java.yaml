                instance: /api/v1/conversations/0192f3a4-8c3d-7e21-8f90-abcdef123456/ask
                code: AGT-VALIDATION-003
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    RateLimited:
      description: 触发用户/接口限流
      headers:

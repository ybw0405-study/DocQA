      operationId: listDocuments
      summary: 分页查询当前用户的文档列表
      description: |
        按 `created_at DESC, id DESC` 返回当前用户的文档，用于文档列表页与「最近上传」区块。
        `userId` 只取自 JWT `sub`，查询条件恒带 `user_id`，因此结果不可能跨用户。

        列表项不含 `errorMessage` 自由文本，只暴露可公开展示的 `errorCode`；
        `chunkCount` 只统计与文档当前 `index_version` 一致的分块，与状态查询接口口径相同。

        `status`、`q`、`tag` 三个过滤条件可以叠加，彼此是 AND 关系；`tag` 走标签关联表的反查索引，
        `q` 是文件名与展示标题的子串匹配。**游标不编码过滤条件**，只编码排序键与记录 ID，
        因此切换 `status`/`q`/`tag` 时必须丢弃旧游标回到第一页——用旧游标续翻会得到「新条件 + 旧位置」
        的混合结果页，服务端无法察觉，所以这条写成契约而不是实现细节。

        已软删除的文档在**任何**过滤组合下都不出现，包括 `status=FAILED` 这类显式状态查询；
        列表项的 `tags` 恒为数组，无标签时是空数组而不是 `null`，前端不需要区分「没查」与「没有」。

        GET 是安全方法，不使用 `Idempotency-Key`，也不写幂等记录。

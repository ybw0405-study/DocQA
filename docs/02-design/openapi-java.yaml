openapi: 3.0.3
info:
  title: DocQA Java API
  version: 2.9.0
  description: |
    本文件是 Java 对外核心业务接口契约，覆盖 5 个核心业务接口，
    并在实现时补充 Auth 支撑接口与会话创建接口；1.2.0 与 1.3.0 为 `frontend-vue` 补充四个只读列表接口。
    2.0.0 是不向后兼容的**身份模型改造**：演示账号改为持久用户表 + 自助注册，
    访问令牌不再由客户端持久化，刷新令牌改为 `HttpOnly` Cookie 且每次使用即轮换。
    2.1.0 是**文档域补全**（向后兼容的次版本）：新增重命名、标签整集替换、软删除、
    失败重试与重建索引五个写操作，列表接口新增 `q` 与 `tag` 搜索参数，状态与列表响应新增可空字段。
    2.2.0 是**课表导入**（向后兼容的次版本）：新增 ICS 预览与导入两个操作，
    请求体形态为本契约首个 `multipart/form-data`；既有 schema 一律不删字段、不新增 required，
    因此 2.1.0 的客户端无需改动即可继续工作。
    2.3.0 是**提醒状态机与站内通知**（向后兼容的次版本）：新增单个提醒的状态变更
    （`PATCH` + `version` 乐观并发）、通知列表与标记已读三个操作；`ReminderKind` 补 `COURSE` 枚举成员，
    看板行新增字段 `leadMinutes`（它是**响应 schema 的 required 追加**，收紧的是生产侧：服务端必须开始发送该字段，
    而忽略未知字段的既有读侧客户端不受影响）。这两处都是**追加**而非改名，2.2.0 的客户端继续可用，但只按
    `DEADLINE` / `CUSTOM` 两值分派 `kind` 的客户端会把新出现的 `COURSE` 落进默认分支——这是当初
    看板把课表行显示成「自定义」的同一处信息丢失，本轮予以更正。
    2.4.0 是**治理运维面**（向后兼容的次版本）：新增管理员专用的 AI Kill Switch、
    按用户日配额、审计事件查询与问答用量汇总共 **5 条路径 / 6 个操作**，统一落在 `/api/v1/admin/**`；
    既有路径、schema 与错误码一律不删不改。错误码只新增一个 `COM-NOT_FOUND-001`（路径不存在），
    配额超限复用既有 429 `COM-RATE_LIMIT-001` 与 `Retry-After`，不新增同义错误码。
    2.5.0 是**流式问答**（向后兼容的次版本）：新增 `POST …/ask:stream` 一个操作，
    响应为 `text/event-stream` 事件流（`meta` → `delta`… → `done` | `error` 四帧协议）；
    非流式 `POST …/ask` 原样保留，两个操作共享同一治理管线（幂等 / 限流 / 配额 / Kill Switch / PII / 缓存）。
    治理拒绝（校验 / 429 / Kill Switch / 幂等冲突等）发生在首个事件帧**之前**时，响应仍是
    普通 JSON ProblemDetail 而非 SSE 流；`error` 帧只在 `meta` 帧已经下发之后才可能到达。
    不新增错误码、不动既有路径与 schema。
    2.6.0 是**租户级 AI 治理开关**（向后兼容的次版本）：新增
    `GET/PUT /api/v1/admin/ai/controls/tenant` 一条路径 / 两个操作，落在既有 `/api/v1/admin/**`
    面下。全局一键全停 `agent:kill-switch` 语义不变，新增按租户隔离的
    `agent:kill-switch:tenant:{tenantId}` 键，两者在 Python agent 执行点按 OR 判读；
    `tenantId` 一律取自已验签 JWT，不接受请求体或 Header 传参。既有路径、schema 与错误码
    一律不删不改，新增一个 `KillSwitchStateEnvelope` 响应信封。
    2.7.0 是**模型连接管理面**（向后兼容的次版本）：新增 `/api/v1/admin/ai/model-connections`
    及其 `presets` / `{connectionId}` / `credential` / `probe` / `activation` 子路径，
    共 **6 条路径 / 7 个操作**，让管理员在界面里选厂商预设、填自己的 API Key、测试连通性并设为生效，
    取代「改 env 再重启」。厂商预设目录由服务端下发（前端红线禁止生产源码出现绝对服务地址，
    且端点变化不必发前端版本），内容是公开端点与模型别名，不含任何密钥。
    凭据**只进不出**：明文 Key 只出现在 `PUT …/credential` 的请求体，服务端以 AES-256-GCM
    封装落库（AAD 绑定 `connectionId|tenantId`），读侧只有 `hasCredential` 布尔。
    写操作全部按值幂等（创建按租户内 `name` upsert、凭据与生效状态覆盖式写入），
    沿用 D-197「管理端不声明幂等头」。**不新增错误码**：连接不存在复用 `COM-NOT_FOUND-001`，
    出网策略与连接数上限复用 `COM-VALIDATION-001`，主密钥未配置复用 `COM-INTERNAL-001`；
    探测失败不是 HTTP 错误，仍返回 200 并由 `ModelProbeFailure` 枚举表达结论。
    跨语言协议（`cross-language-protocol.md`）**零改动**：刻意不给 ask payload 增加模型字段，
    改由网关把生效连接的密文发布到 `agent:model-connection:tenant:{tenantId}`，
    数据面用同一把主密钥本地解密后按请求选模型——明文 Key 不过内部 HTTP，也不过 Redis。
    2.8.0 是**可观测性入口**（向后兼容的次版本）：新增 `GET /api/v1/admin/observability`
    一条路径 / 一个操作，返回网关配置的 LangFuse 基地址（`langfuseBaseUrl`，空串 = 未部署即禁用），
    供管理面审计页在运行时拼 `{base}/trace/{traceId}` 追踪链接。只读部署配置，不新增错误码、
    不动既有路径与 schema，也不给审计 payload 白名单新增任何键。
    2.9.0 是**长期记忆管理面**（向后兼容的次版本）：新增 `/api/v1/admin/ai/memories` 与
    `…/{memoryKey}` 共 **2 条路径 / 2 个操作**（读清单 + 删除），网关代理数据面的内部端点。
    记忆只由用户在问答里显式下达「记住：…」指令写入：数据面对掩码后的问题做前缀判定，
    事实再掩码复检、残留 PII 拒写，按 `(tenantId, userId)` 命名空间隔离，每用户上限 50 条
    （溢出淘汰最旧）、TTL 90 天；注入 prompt 时走 `<memory>` 不可信围栏，不影响工具与引用。
    管理面没有写入口。`tenantId` 取自已验签 JWT，`userId` 是被治理用户；删除按值幂等，
    不声明 `Idempotency-Key`（D-197 同裁决）。**不新增错误码**：记忆不存在复用 `COM-NOT_FOUND-001`，
    数据面未启用记忆或不可达复用 `AGT-UPSTREAM-001`（503），不假装空清单。

    - 2.1.0 新增的五个写操作全部要求 `Idempotency-Key`，`operation` 取值分别为
      `DOCUMENT_RENAME`、`DOCUMENT_TAG_UPDATE`、`DOCUMENT_DELETE`、`DOCUMENT_RETRY`、`DOCUMENT_REINDEX`；
      幂等语义与其它写接口一致，同 key 同指纹返回原响应、同 key 不同指纹返回 409 `DOC-CONFLICT-001`。
    - **软删除跨两个存储，收敛是异步的**：`DELETE` 返回 204 表示 MySQL 侧已不可见（列表、状态、详情、
      秒传命中与网关检索范围立即排除该文档），向量侧删除由异步消息驱动；因此本契约不承诺「返回 204 时向量已消失」，
      只承诺此后任何检索都无法命中该文档。可判读的收敛状态由状态响应的 `vectorConsistency` 暴露。
    - 重建索引（`reindex`）采用**双版本共存**：新索引写入 `v{n+1}` 期间 `status` 保持 `INDEXED`、旧版本继续可检索，
      成功后原子推进并清理旧版本；因此重建失败不会让文档失去已有索引，`pendingIndexVersion` 非空即表示重建在途。
    - 搜索只做**元数据**匹配（文件名与展示标题的子串）加标签精确过滤，不检索文档正文；
      正文级检索的唯一入口是问答接口的 RAG 链路。本契约不保证大表下的搜索性能，见存储设计的索引取舍。

    - 2.2.0 的课表导入拆成**预览 + 导入两步**，而不是一个「导入并返回结果」的操作：
      只有让调用方在写入之前逐事件看到 `CREATE` / `UPDATE` / `UNCHANGED` / `STALE` 判定，
      「导入失败不会产生半套课表」这条验收判据才可判读。代价是同一文件要上传两次，
      且预览是**非承诺**的——两次调用之间的并发写入会改变判定，最终以导入响应为准。
    - 两个操作都使用 `multipart/form-data`：`file` 部分是 ICS 原始字节，其余为文本参数。
      不走 JSON 文本体是因为 JSON 只能携带**浏览器已解码**的内容，非 UTF-8 的课表文件会在到达
      服务端前就变成 U+FFFD，服务端再也无法区分「本来就是乱码」与「解码方式选错」。
      文件上限 2MiB（`REM-VALIDATION-002`/413），ICS 部分必须是 `text/calendar` 或
      `application/octet-stream`（`REM-VALIDATION-003`/415）。
    - ICS 解析遵循「**影响触发时刻的属性一律严格，其余一律忽略**」：`VCALENDAR` 与
      `VERSION` 必需，`VEVENT` 内按白名单取 `UID` / `SEQUENCE` / `SUMMARY` / `DTSTART` /
      `RRULE` / `EXDATE` / `DESCRIPTION`；`VTIMEZONE`、`VALARM`、`LOCATION`、`X-*` 忽略，
      否则 Google 与 Outlook 的导出文件必然整体导入失败。`RDATE` 与 `RECURRENCE-ID`
      明确**拒绝**并给出属性名与物理行号：前者需要与 RRULE 网格求并集，后者表示单次改期，
      两者都会破坏「一行一规则」的存储模型。
    - `DTSTART` 支持三种形态：`DTSTART;TZID=<IANA>`、结尾 `Z` 的 UTC 形式、以及无参数的
      floating 本地时间（按请求的 `fallbackTimezone` 解释，缺该参数则 422）。存库统一为 UTC，
      `timezone` 列保存用于展示还原的 IANA 区名，因此「08:00 的课」在响应里仍是 08:00。
    - 一次性事件（课表里无 `RRULE` 的单次活动）写入 `FREQ=DAILY;COUNT=1`，`dtstart` 保持**上课时刻**，
      `nextTriggerAt = occurrence - leadMinutes`；`EXDATE` 作用在 occurrence 而非提醒时刻上。
      date-only 的 `EXDATE`（全校停课一天）按**当地日期**判重，与时刻级 `EXDATE` 分列存储。
    - **结构错误整批失败并回滚，版本陈旧局部跳过**：位置、折行、缺 `END:VEVENT`、属性非法等
      解析缺陷返回 422 且 `errors` 指出行号或 UID（`ProblemDetail.errors` 上限 20 条，
      其余在 `detail` 中汇总数量），事务不提交；而文件 `SEQUENCE` **低于**库内值的事件记为 `STALE`，
      不阻断整批。导入不删除文件里已消失的旧课程，该缺口由逐条取消入口（S4）承接。
    - 预览是**只读语义的 POST**：它改变服务端状态的程度只有一次文件读取，因此接受但不消费
      `Idempotency-Key`（传与不传结果相同，也不写幂等记录）；导入是写接口，`operation` 为
      `SCHEDULE_IMPORT`，指纹为 `sha256(文件 SHA-256 | fallbackTimezone | leadMinutes)`，
      持久化键为 `sha256hex(requestKey | uid)` 以支持同批多事件。
    - **`UNCHANGED` 与 `STALE` 的触发时刻取库内行，不取本次请求参数**：这两个状态不产生写入，
      所以 `nextTriggerAt` 就是库内 `next_trigger_at`（那才是真正会响的时刻），`followingTriggerAt`
      按库内行自身的 `lead_minutes` 在其之后求。用本次 `leadMinutes` 覆盖会让响应与库内实际调度不一致，
      而「用户换个提前量再预览一次」正是最容易撞上这一点的操作。
    - **`UPDATE` 不复活已终止的提醒**：只覆盖规则字段并沿用库内行的 `status`，`CANCELLED` / `PAUSED`
      的课表行不会因为教务系统重新导出而变回 `ACTIVE`。取消是用户在系统内的显式决定，
      更高的 `SEQUENCE` 不构成撤销它的依据；恢复入口属于 S4 的逐条操作。
    - **multipart 的三种非法形态分岔（由控制器测试逐条钉住）**：必需 Part 缺失（三个 Part 任一）
      一律 400 `COM-VALIDATION-001`，`errors[].field` 是该 Part 名——`file` 经服务本地 advice，
      两个文本 Part 因为是普通表单字段、由容器暴露成请求参数，因而与 query 参数同判据；
      声称 `multipart/form-data` 但**信封解析不开**（boundary 非法、Part 头残缺）才是 415
      `REM-VALIDATION-003`，`errors[].field` 为 `request`。缺字段与媒体类型不接受是两回事，
      同一个「少传一个 Part」的失误不应因 Part 类型不同而得到两种状态码。
      而**顶层 `Content-Type` 不是 `multipart/form-data`** 的情形由全局 advice 的专用 handler
      映射为 415 `COM-UNSUPPORTED_MEDIA-001`（R-02 已落地，不再落 `Exception.class` 兜底 500）；
      「HTTP 方法不支持」同批修复为 405 `COM-METHOD_NOT_ALLOWED-001`，响应带 `Allow` 头。
      两者与 `REM-VALIDATION-003`（信封解析不开）分属不同路径，控制器测试逐条钉住。
    - **两个文本 Part 按请求参数绑定，不按消息转换器绑定**：客户端以 `Content-Disposition: form-data`
      的普通字段发送即可，**不需要也不消费** Part 级 `Content-Type`；`curl -F` 与浏览器 `FormData`
      的默认形态就是如此。若服务端改按 `@RequestPart` 绑定这两个字段，没有任何消息转换器能把无媒体
      类型的文本字段读成 `String` / `int`，每个请求都会在绑定阶段抛出上一条那个 415。
    - `/ics/*` 上 `REM-VALIDATION-001` 的 `errors[].field` 有**两种形态**，同码不同形是刻意的：
      文件结构缺陷给 `file.line.<N>` 或 `file.uid.<UID>`（回答「文件哪里错了」），
      `fallbackTimezone` 取值非法给 `fallbackTimezone`（回答「哪个参数错了」）。
      后者包含未知 IANA 区名，以及 `+08:00` 这类**偏移量而非区名**的取值——偏移量无法还原
      夏令时规则，也就无法在 date-only 停课上按当地日期判重。
    - 2 MiB 上限有**两道同值判据**：容器侧 `max-file-size` 与业务侧字节判定都是 2 MiB，
      容器抛出的超限异常同样映射为 413 `REM-VALIDATION-002`，因此调用方不依赖哪一道先触发；
      容器上限不得低于业务上限，否则合法文件会先被容器打成异常。

    - 2.3.0 的提醒状态机**只有六条合法迁移边**：`ACTIVE → PAUSED | COMPLETED | CANCELLED`、
      `PAUSED → ACTIVE | COMPLETED | CANCELLED`；`COMPLETED` 与 `CANCELLED` 是终态，
      没有指向其它状态的出边。非法边返回 409 `REM-CONFLICT-004`，而不是先写库再报错，也不是静默成功；
      目标状态**等于**当前状态是同态提交，按 no-op 返回 200 且不推进 `version`。
    - **恢复不是补发**：`PAUSED → ACTIVE` 时服务端按「不早于当前时刻的第一个 occurrence」重新求
      `nextTriggerAt`，暂停期间错过的 occurrence 一律不追溯触发，也不写入通知。这是 US-07
      「恢复时重新计算下一次触发而不是补发历史所有触发」的落地判据。
    - **`version` 是唯一 CAS 凭据，且不止用户编辑会推进它**：调度器每次成功触发（推进或置为
      `COMPLETED`）同样 `version = version + 1`。因此 409 `REM-CONFLICT-003` 有两种真实成因——
      另一个标签页改过，或者**这条提醒刚刚真的触发过一次**。客户端动作相同：重读再决定，
      所以本接口同时要求 `Idempotency-Key`（`operation` 为 `REMINDER_UPDATE`），
      让「请求已成功但响应丢失」的重试拿回原响应而不是一个假的冲突。
    - 提醒不存在**或**不属于当前用户统一 404 `REM-NOT_FOUND-001`（与 `DOC-NOT_FOUND-001` 同口径），
      响应不区分两种情形，避免用探测的方式确认他人提醒是否存在。
    - **站内通知由 `reminder-due` 的消费落地产生**：2.2.0 及之前该 topic 没有任何订阅者，
      提醒「到点触发」的链路只到发布为止；2.3.0 起 `reminder-service` 自身订阅并逐条落库。
      一条 occurrence 一行，唯一键为 `(reminder_id, planned_trigger_at)`（该列承载扫描命中的**计划触发时刻**，
      课表类即「上课时刻 − 提前量」），因此 RocketMQ 的
      at-least-once 重投不会产生第二条通知；`deliveredAt` 取**首次**落库时刻。
    - 标记已读是**收敛操作**，因此**不要求** `Idempotency-Key`：`read_at` 只在由空变有时写入，
      重复标记既不改写首次已读时刻也不报错，越权或不存在的 `ids` 直接不在更新集合内。
      `all=true` 与 `ids` 互斥（同时给出为 400 `COM-VALIDATION-001`），因为「先取 id 再提交」
      无法覆盖未加载页的未读项。
    - 通知列表按 `planned_trigger_at DESC, id DESC` 排序（最新在前），游标编码与排序键严格一致；
      **不提供未读数与总数**，既有只读列表一律无 `COUNT`，加角标需另开切片。

    - 2.4.0 的管理面**只存在于 `agent-gateway`**：`audit-service` 保持无 Web 面的后台消费者定位，
      管理查询由网关直读 MySQL。6 个操作全部要求 `ADMIN` 角色，非管理员（含未登录）分别返回
      403 `USR-FORBIDDEN-001` / 401 `USR-AUTH-001`；管理面不投递 MQ、不调用 Python、不触发 LLM。
    - **Kill Switch 的生效窗口是 30 秒，不是「立即」**：网关进程内缓存 30 秒、Python 侧缓存 5 秒，
      因此开关写入后所有实例在最长 30 秒内收敛；开启后新的问答返回 503 `AGT-UPSTREAM-003`，
      登录、上传、提醒与审计查询不受影响。状态事实是 Redis 键的存在性，元数据（操作者与时刻）单独存储，
      元数据缺失不改变开关本身。
    - **管理面的两个 `PUT` 有意不使用 `Idempotency-Key`**：它们是对单一状态的全量赋值，重复提交得到
      同一状态；每次调用都会产生一条新的管理审计事件，这是操作留痕而不是业务副作用。这也是本文
      「写接口必须携带 `Idempotency-Key`」的唯一例外，与签发类端点的豁免理由不同。
    - **实验账本只读、不提供在线重置**：`callsUsed` / `tokensUsed` 计数没有 TTL，上限是配置给定的
      真实花费硬闸；把它暴露成管理 API 等于给任意管理员令牌一个「抹掉花费闸门」的能力。需要重置时
      由部署者人工删键并自行留痕。`limitsKnown=false` 表示 Python 尚未发布上限，此时上限为 `null`。
    - **日配额是业务约束而非安全边界**：缺行表示不设上限；问答次数是硬闸（准入即计数，幂等重放与
      Kill Switch 拒绝不计数，缓存命中计入），token 是软闸（调用前只能依据当日累计拒绝下一次）。
      超限复用 429 `COM-RATE_LIMIT-001`，`Retry-After` 为到下一个 UTC 零点的秒数，`detail` 写明
      「当日 AI 配额已用尽」；客户端不能只凭 code 区分突发限流与日配额。Redis 故障时不本地兜底，
      与既有 `RateLimiter` 一致上抛 500。
    - **审计查询只读、不可变**：返回的是写入时已过白名单与 PII 清洗的 `payload_redacted`，不是原始输入；
      查询按 `occurred_at DESC, id DESC` keyset 分页，时间窗默认 24 小时、最长 31 天。本契约不为
      `audit_event` / `agent_execution` 提供任何更新或删除能力，管理动作本身也只追加审计。
    - **用量看板不做统计推断**：只返回计数与均值（`avgLatencyMs`），窗口内无执行时为 `null`；
      不返回 p50/p95。单机样本的分位数没有统计意义，性能结论以 S11 压测为准。
    - **JSON 响应统一声明 `charset=UTF-8`**：所有 `application/json` 与 `application/problem+json`
      响应在 `Content-Type` 上追加 `charset=UTF-8`；二进制下载、`text/event-stream` 与已显式声明
      charset 的响应不改写。这是响应头行为，不改变任何 schema 或字段语义。
    - JWT 由 `user-service` 的登录流程签发；Auth 接口不计入 5 个核心业务接口。
    - **访问令牌**（access）是 HS256 JWT，有效期 15 分钟，只经 `Authorization: Bearer` 头出现，
      客户端必须只保存在内存中；服务端不通过任何非 `auth` 类响应下发它以外的持久凭据。
    - **刷新令牌**（refresh）是不透明高熵随机串，只经 `Set-Cookie` 下发，属性固定为
      `HttpOnly` + `SameSite=Lax` + `Path=/api/v1/auth` + `Max-Age=14d`；`Secure` 由部署环境变量
      `DOCQA_COOKIE_SECURE` 控制（默认 `true`；仅本机 http 演示允许置 `false`）。
      数据库只保存其 SHA-256 摘要，任何响应与日志都不出现原文。
    - 刷新令牌**一次使用即轮换**；服务端以 `family_id` 记录血缘，命中已轮换或已吊销的旧令牌时
      吊销整个家族并返回 401（被盗令牌的复用必须导致全家族失效，而不是静默续期）。
    - `POST /api/v1/auth/logout` 与改密成功都使旧凭据失效：refresh 行置吊销，同时把当前 access 的
      `jti` 写入 Redis 撤销表（TTL = 该令牌剩余寿命），Gateway 与各业务服务在验签后额外检查该键。
      因此登出在 15 分钟窗口内是**即时**的，不依赖 access 自然过期。
    - 签发类端点（`login`、`refresh`、`logout`）**有意不使用 `Idempotency-Key`**：幂等重放会把
      「同一把钥匙」返回给已经不该再持有它的调用方，与轮换、吊销语义直接冲突；这三类端点的
      重放安全性由「旧令牌立即失效 + 每次都签发新令牌」保证，而不是由请求指纹保证。
      其余写端点（`register`、改密、角色与状态变更）仍必须携带 `Idempotency-Key`。
    - **授权（RBAC）**：角色为 `USER` / `ADMIN` 多值集合，来自 JWT 的 `roles` 声明；
      该声明由 `user-service` 在签发时从 `app_user_role` 读出，业务服务只信任自己验签后的令牌，
      不接受任何 Header 或 Body 传入的 `userId` 与 `roles`。角色变更对已签发令牌的影响上限是 access TTL。
    - 会话创建由 `POST /api/v1/conversations` 提供；首次问答时服务端也会为尚未落库的
      `conversationId` 自动创建归属当前用户的空会话，两条路径共享同一套归属与幂等规则。
    - 所有成功响应使用 `{code, msg, data, traceId}` 信封；所有错误响应使用 RFC 9457 `application/problem+json`。
    - 除上条列出的签发类端点外，写接口必须携带 `Idempotency-Key`；服务端按 `userId + operation + key` 记录 24 小时请求指纹和响应摘要。
    - 资源不存在与无权访问统一返回 404，不通过 403 暴露资源是否存在。
    - 只读列表接口：`GET /api/v1/documents`、`GET /api/v1/reminders`、
      `GET /api/v1/conversations`（1.3.0）、`GET /api/v1/conversations/{conversationId}/messages`。
      列表采用 keyset 游标分页，`nextCursor` 由上一页最后一条已返回记录的排序键与 ID 编码而成，客户端不得自行构造；
      游标非法或越界一律返回 400，不静默回退到第一页。
    - GET 是安全方法，一律不使用 `Idempotency-Key`，也不产生幂等记录。
      同理适用于**只读语义的 POST**（当前只有 `POST /api/v1/reminders/ics/preview`）：
      它使用 POST 只是为了携带文件体，服务端不写任何存储，因此同样不产生幂等记录，
      上一条「写接口必须携带 `Idempotency-Key`」对它不适用——它接受该头但不消费（见 `IdempotencyKeyOptional`）。
    - 会话列表按 `lastMessageAt` 倒序返回归属当前用户的会话元数据（标题与预置文档范围），
      从未发言的会话排在末尾并以空排序键的游标续翻；本接口不返回任何消息正文。
    - 消息历史在服务端读取时按 `pii-v1` 规则脱敏后才返回，`content` 中的邮箱、手机号、
      身份证号已替换为 `[EMAIL]`、`[PHONE]`、`[ID_CARD]` 占位符。
    - 列表项不返回 `errorMessage` 自由文本，只返回可公开展示的 `errorCode`。
  contact:
    name: DocQA Architecture Owner
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /
    description: 同源部署或本地开发
  - url: https://api.docqa.example
    description: 示例域名；部署时替换为真实域名
tags:
  - name: Auth
    description: 注册、登录、刷新令牌轮换与吊销、改密、当前用户身份与角色查询
  - name: Users
    description: 管理员面：用户列表、角色授予与回收、账号状态变更
  - name: Documents
    description: 文档上传、完成与状态查询；重命名、标签整集替换、软删除、失败重试与重建索引；列表支持元数据搜索与标签过滤
  - name: Conversations
    description: 基于文档的问答
  - name: Reminders
    description: 截止提醒与自定义重复提醒；ICS 课表预览与整批导入；单个提醒的暂停、恢复、完成与取消
  - name: Notifications
    description: 站内通知流：由 `reminder-due` 消费落库的每次触发一条，列表与标记已读
  - name: Admin
    description: 管理员治理面：AI Kill Switch、按用户日配额、审计事件查询、问答用量汇总与可观测性入口；全部要求 `ADMIN` 角色
security:
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: 使用用户名与口令登录，签发访问令牌并下发刷新令牌 Cookie
      description: |
        校验用户名与 `app_user.password_hash` 中的 BCrypt 摘要，成功后签发 HS256 访问令牌：
        `sub` 为 userId、`roles` 为当时的角色集合、有效期 15 分钟；响应包含统一信封和 `traceId`。

        同一响应以 `Set-Cookie` 下发刷新令牌，并开启一个新的轮换家族：客户端拿不到它的原文，
        也无需在后续请求体里回传——`/api/v1/auth/refresh` 由浏览器自动携带该 Cookie。
        每次登录都会建立新家族，历史家族互不影响，登出只吊销当前家族。

        登录失败统一返回 401 `USR-AUTH-001`，不区分用户名不存在或密码错误，避免用户名枚举。
        账号被管理员停用（`status = DISABLED`）返回 403 `USR-DISABLED-001`，与凭据错误可区分，
        因为停用是账号状态而非保密信息，且客户端需要给出明确的「联系管理员」文案。
        同一 `username + IP` 在 60 秒内失败 5 次后，第 6 次返回 429，并携带 `Retry-After`。
        本接口不放在 5 个核心业务接口范围内，也不使用 `Idempotency-Key`（理由见 `info.description`）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              demo:
                summary: 演示账号登录
                value:
                  username: demo
                  password: change-me
      responses:
        '200':
          description: 登录成功
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEnvelope'
              examples:
                success:
                  value:
                    code: OK
                    msg: success
                    data:
                      accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwMDAwMDAwMC0wMDAwLTAwMDAtMDAwMC0wMDAwMDAwMDAwMDEifQ.signature
                      tokenType: Bearer
                      expiresIn: 900
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountDisabled'
        '429':
          $ref: '#/components/responses/LoginRateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/register:
    post:
      tags:
        - Auth
      operationId: register
      summary: 自助注册新用户
      description: |
        创建持久用户并授予默认角色 `USER`，口令以 BCrypt（cost 由服务端配置，默认 12）摘要落库，
        明文不出现在任何响应、日志或错误信息中。注册成功即完成一次登录：签发访问令牌并下发刷新令牌 Cookie，
        客户端不需要再走一次 `login`。

        用户名按 `^[A-Za-z0-9_.-]{3,32}$` 校验（允许大写输入，服务端统一小写归一后按大小写不敏感判重），
        格式非法返回 400 `COM-VALIDATION-001`，重名返回 409 `USR-CONFLICT-001`。
        口令必须满足 `PasswordPolicy`（长度 10—72 个 UTF-8 字节，且至少包含字母与数字各一个），
        不满足返回 422 `USR-VALIDATION-001`，`errors` 只给规则不回显被拒绝的值。
        是否开放自助注册由部署开关 `docqa.auth.self-registration-enabled` 决定，
        关闭时返回 403 `USR-FORBIDDEN-001`，由管理员通过用户管理面建号。
        同一来源 IP 在 120 秒固定窗口内发起 5 次注册请求（无论最终成功或被拒）后返回 429 并携带
        `Retry-After`。按请求次数而非失败次数计数，是因为批量建号的产物恰恰是**成功**注册；
        只统计失败会让脚本在每轮都成功的情况下永远不触发限流。

        本端点此时还不存在 `userId`，幂等指纹作用域改为 **`username + operation + key`**。
        仍要求 `Idempotency-Key` 的理由是：注册是创建行的非幂等写，没有键时「网络重试」与
        「他人同名注册」在响应上不可区分；有键时前者返回首个请求的原响应，后者才返回 409。
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              student:
                summary: 学生自助注册
                value:
                  username: zhang.wei
                  password: correct-horse-9
      responses:
        '201':
          description: 注册成功并建立会话
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEnvelope'
              examples:
                created:
                  value:
                    code: OK
                    msg: success
                    data:
                      accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwMTkyZjNhNC05ZDRlLTdmMzItOGEwMS0xMjM0NTY3ODkwYWIifQ.signature
                      tokenType: Bearer
                      expiresIn: 900
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/UserConflict'
        '422':
          $ref: '#/components/responses/PasswordTooWeak'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshToken
      summary: 用刷新令牌 Cookie 换取新的访问令牌
      description: |
        请求必须携带 `docqa_refresh` Cookie；请求体与查询参数都不接受刷新令牌原文，
        因此前端代码任何位置都不需要持有它。成功时签发新的访问令牌，并**轮换**刷新令牌：
        旧行标记为已使用，新行继承其 `family_id`，响应以新的 `Set-Cookie` 覆盖。

        服务端在 `app_user.status != ACTIVE`、令牌不存在、已过期、已使用或已吊销时一律返回
        401 `USR-REFRESH-001`，不区分具体原因，避免向请求方透露令牌是否存在。
        命中「已使用或已吊销」的令牌视为复用攻击：此时吊销该 `family_id` 下的全部令牌后返回同一个 401，
        使攻击者与被盗号的正常用户同时失效，客户端必须据此清除内存中的访问令牌并跳转登录。
        本端点是可 bootstrap 的公开路径，浏览器在无 Cookie 时调用同样得到 401。
      security:
        - refreshCookie: []
      responses:
        '200':
          description: 轮换成功
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEnvelope'
              examples:
                rotated:
                  value:
                    code: OK
                    msg: success
                    data:
                      accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwMDAwMDAwMC0wMDAwLTAwMDAtMDAwMC0wMDAwMDAwMDAwMDEifQ.signature
                      tokenType: Bearer
                      expiresIn: 900
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '401':
          $ref: '#/components/responses/RefreshRejected'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: 登出并吊销当前刷新令牌家族与访问令牌
      description: |
        吊销 Cookie 中刷新令牌所属 `family_id` 的全部行，并覆盖清除该 Cookie；
        若请求同时携带有效访问令牌，则把其 `jti` 写入 Redis 撤销表（TTL = 该令牌剩余寿命），
        使登出在 access 自然过期之前真正生效。

        本端点是公开路径且**同时接受**「只带 Cookie」和「同时带访问令牌 + Cookie」两种调用：
        访问令牌已过期但刷新令牌仍有效时，登出必须仍然可用，否则用户无法从失效会话中退出。
        重复调用与对已吊销令牌调用都返回 204，不返回 401——登出的目标是「此后没有凭据」，
        而不是「报告此前是否有效」。响应无正文，因此不产生成功信封。
        不使用 `Idempotency-Key`：吊销本身是幂等的。
      security:
        - {}
        - bearerAuth: []
      responses:
        '204':
          description: 已登出（无响应体）
          headers:
            Set-Cookie:
              description: |
                下发同名空值 Cookie 以立即过期：`docqa_refresh=; HttpOnly; SameSite=Lax;
                Path=/api/v1/auth; Max-Age=0`，`Secure` 随 `DOCQA_COOKIE_SECURE` 附加。
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/password:
    post:
      tags:
        - Auth
      operationId: changePassword
      summary: 校验当前口令后修改口令
      description: |
        必须提供当前口令：只凭访问令牌改密意味着「拿到 15 分钟令牌就能永久占有账号」，
        这不是改密而是接管。缺少或错误口令统一返回 401 `USR-AUTH-001` 并计入登录失败限流，
        不给攻击者「口令对不对但当前密码缺失」的区分度。

        新口令必须满足 `PasswordPolicy`；与当前口令相同返回 422 `USR-VALIDATION-001`。
        修改成功后吊销该用户**全部**刷新令牌家族（不只是当前会话），并把用户级访问令牌吊销水位
        `auth:revoked:user:{userId}` 推进到当前时刻——改密通常正因为怀疑凭据已泄露，其他设备上的
        在途 access 也必须一并作废，只撤销本次调用所用的单个 `jti` 覆盖不到它们。
        响应不含任何令牌，客户端需要重新登录。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            examples:
              change:
                value:
                  currentPassword: correct-horse-9
                  newPassword: new-battery-11
      responses:
        '204':
          description: 修改成功，全部会话已失效（无响应体）
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccountDisabled'
        '422':
          $ref: '#/components/responses/PasswordTooWeak'
        '429':
          $ref: '#/components/responses/LoginRateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/me:
    get:
      tags:
        - Auth
      operationId: getCurrentUser
      summary: 查询当前访问令牌对应的身份、状态与角色
      description: |
        校验 `Authorization: Bearer <JWT>` 的签名、算法、issuer、audience、过期时间、`sub` 与撤销表。
        仅从 JWT `sub` 获取 userId，`roles` 仅从自己验签通过的 JWT `roles` 声明读取，
        不接受 Header 或 Body 传入的 userId 与角色。
        `username` 与 `status` 来自 `app_user` 当前行：角色允许短时陈旧（上限是 access TTL），
        但账号状态必须实时，停用后即使旧令牌尚未过期也应立即拒绝。
      responses:
        '200':
          description: 当前用户身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserEnvelope'
              examples:
                currentUser:
                  value:
                    code: OK
                    msg: success
                    data:
                      userId: 00000000-0000-0000-0000-000000000001
                      username: demo
                      status: ACTIVE
                      roles:
                        - USER
                        - ADMIN
                      accessTokenExpiresIn: 843
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '401':

  /api/v1/documents/{documentId}:
    patch:
      tags:
        - Documents
      operationId: renameDocument
      summary: 修改文档展示标题
      description: |
        部分更新，只改展示标题 `title`。`userId` 取自 JWT `sub`，文档不属于当前用户时返回 404。

        **`fileName` 不可改**：它是原始文件名，已进入 `parse-requested` 事件与 PGVector 的
        `metadata.file_name`，改名会让「同一个文档在两个存储里叫不同名字」，引用展示与排障立刻失去对照。
        展示口径统一为 `title ?? fileName`，因此 `title` 为 null 的旧文档不需要数据迁移。

        标题按原样回显给属主本人，不做 PII 掩码（消息正文才需要掩码，因为它进入 Prompt 与审计）；
        但标题**不进入任何 MQ 事件、审计载荷与日志**，只有 MySQL 的 `document.title` 列和响应体携带它。
        纯空白或空串非法（返回 400），不做静默 trim 后落库——`"  "` 与 `""` 都应当是「没填」而不是「填了个空格」。

        本操作纯同步落 MySQL，不触碰索引、不投递任何 MQ 消息。
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'

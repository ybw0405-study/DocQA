          items:
            type: string
            maxLength: 24
          description: |
            本页文档的标签，按**一次** `document_id IN (本页 IDs)` 批量查询得出，
            与 `chunkCount` 同构；不在循环里逐条查询，否则一页 20 条会变成 40 次往返。

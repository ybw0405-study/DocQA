        要求两个字段都出现，是为了让「忘记传某个字段」不会被误解成「清除该维度」；调用方必须显式
        表达意图。`dailyQuestionLimit` 是硬闸（问答准入即计数），`dailyTokenLimit` 是软闸
        （调用前只能读到当日累计，达到上限后拒绝下一次）。

        目标用户不存在返回 404 `USR-NOT-FOUND-001`。配额写入与管理审计事件插入在同一 MySQL 事务内。
        本端点不投递 MQ、不调用 Python、不触发 LLM；不使用 `Idempotency-Key`，理由见文首 2.4.0 条目。

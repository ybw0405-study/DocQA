  /api/v1/admin/ai/controls:
    get:
      tags:
        - Admin
      operationId: getAiControls
      summary: 读取 AI Kill Switch 与实验账本快照
      description: |
        需要 `ADMIN` 角色。返回两项互相独立的治理状态：

        - `killSwitch`：Redis 键 `agent:kill-switch` 的**存在性**即「开」。网关进程内缓存 30 秒、
          Python 侧另缓存 5 秒，因此开关变更后所有实例在最长 30 秒内收敛；开启后新的问答返回
          503 `AGT-UPSTREAM-003`，登录、上传、提醒与审计查询不受影响。`updatedAt` / `updatedBy`
          来自与开关同一次写入的元数据键，元数据缺失时为 `null`，不改变状态本身。
        - `experimentBudget`：本轮实验的累计调用数与 token 数，只读。`limitsKnown=false` 表示
          Python 尚未发布上限（离线部署或启动晚于网关），此时 `callLimit` / `tokenLimit` 为 `null`。
          **本接口不提供重置**：上限是配置给定的真实花费硬闸，抹掉计数需要人工删键并留痕。

        本端点不投递 MQ、不调用 Python、不触发 LLM；时间一律 UTC ISO-8601。
      responses:
        '200':
          description: 当前治理状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAiControlsEnvelope'
              examples:
                open:
                  value:
                    code: OK
                    msg: success
                    data:
                      killSwitch:
                        active: false
                        updatedAt: '2026-11-03T09:12:44.120Z'
                        updatedBy: 00000000-0000-0000-0000-000000000001
                      experimentBudget:
                        callsUsed: 22
                        tokensUsed: 2096
                        callLimit: 200
                        tokenLimit: 200000
                        limitsKnown: true
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags:
        - Admin
      operationId: updateAiControls
      summary: 开启或关闭 AI Kill Switch
      description: |
        需要 `ADMIN` 角色。对 Kill Switch 做**全量赋值**：`killSwitchActive=true` 写入 Redis 键
        `agent:kill-switch`（值固定为 `"1"`），`false` 删除该键。响应回显写入后的完整状态。

        顺序与失败语义是刻意的：先写 Redis 再插入审计事件。开关是运行时事实，审计是留痕；若审计写入
        失败，接口返回 500 并在 `detail` 中说明「开关状态已变更」，由调用方重新读取状态，而不是把
        已经生效的变更谎报成失败。Kill Switch 与审计不在同一事务——Redis 无法参与 MySQL 事务。

        本端点不投递 MQ、不调用 Python、不触发 LLM；不使用 `Idempotency-Key`，理由见文首 2.4.0 条目。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAiControlsRequest'
            examples:
              enable:
                value:
                  killSwitchActive: true
      responses:
        '200':
          description: 开关已写入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAiControlsEnvelope'
              examples:
                enabled:
                  value:
                    code: OK
                    msg: success
                    data:
                      killSwitch:
                        active: true
                        updatedAt: '2026-11-03T10:04:11.508Z'
                        updatedBy: 00000000-0000-0000-0000-000000000001
                      experimentBudget:
                        callsUsed: 22
                        tokensUsed: 2096
                        callLimit: 200
                        tokenLimit: 200000
                        limitsKnown: true
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/ai/controls/tenant:
    get:
      tags:

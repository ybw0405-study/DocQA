  /api/v1/documents/{documentId}/status:
    get:
      tags:
        - Documents
      operationId: getDocumentStatus
      summary: 查询文档解析与索引状态
      description: |
        按 `documentId` 查询当前用户拥有的文档状态。查询条件必须同时带 `userId`；
        文档不存在与无权访问统一返回 404，不泄露标题或内容。

        GET 是安全方法，不使用 `Idempotency-Key`；重复调用返回同一时刻的当前状态。
        客户端应使用短轮询（建议 2 秒起，指数退避），不得高频轰炸。

        `vectorConsistency` 是**最后一次确认的对照**，不是跨库实时查询结果：把 `chunkCount`（MySQL 当前版本行数）
        与向量侧上报的 `vectorRows` 比较——相等为 `MATCHED`，不等为 `DIVERGED`，
        向量侧从未上报过（例如 Python Worker 尚未回投或版本回滚后未重建）为 `UNKNOWN`。
        客户端不得把它当成「向量已删除的凭据」，删除的即时事实是本文档已返回 404。

        `pendingIndexVersion` 非空表示重建索引在途：`v{n+1}` 正在写入，此时 `indexVersion` 指向的旧版本仍可检索。
        已软删除的文档在本接口返回 404，与其他读路径一致。

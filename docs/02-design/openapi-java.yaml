components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        访问令牌由 `user-service` 签发：`sub` 为 userId，`roles` 为签发时的角色集合，有效期 15 分钟。
        服务端除验签外还检查 Redis 撤销表中的 `jti`，登出、改密与账号停用都能在该令牌自然过期前使它失效。
        客户端必须只把该令牌保存在内存中，不得写入 `localStorage`、`sessionStorage`、Cookie 或日志。
    refreshCookie:
      type: apiKey
      in: cookie
      name: docqa_refresh
      description: |
        刷新令牌，只由服务端 `Set-Cookie` 下发且带 `HttpOnly`，脚本与页面 JS 都读不到它。
        客户端不得在请求体、查询参数或自定义头里传递刷新令牌原文；
        `/api/v1/auth/refresh` 与 `/api/v1/auth/logout` 依赖浏览器自动携带该 Cookie。

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        写接口必填。建议使用 UUIDv7 或等价的高熵字符串。服务端按
        `userId + operation + key` 保存 24 小时请求指纹和原响应摘要。
        同 key 同指纹返回原响应；同 key 不同指纹返回 409。GET 接口不使用。
      schema:
        type: string
        minLength: 8
        maxLength: 64
        pattern: '^[A-Za-z0-9._:-]+$'
      example: 6c1f3f5e-1d2a-4b3c-8d4e-5f6a7b8c9d0e
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        **接受但不消费**的幂等键，只用于「只读语义的 POST」（当前唯一使用者是 ICS 课表预览）。
        传与不传、传哪个值都不改变响应，服务端既不校验指纹也不写幂等记录。
        保留这个头的原因有二：客户端可以为整条链路统一带上同一个 key 而不必按接口特判；
        以及将来若某个只读操作需要缓存判定，可以直接复用语义而不必把 `required` 从 false 改成 true——
        那是不向后兼容的改动。长度校验与 `IdempotencyKey` 完全相同（8-64，非空白），
        带上非法值仍返回 400 `COM-VALIDATION-001`，不因为「反正不消费」就放过。
      schema:
        type: string
        minLength: 8
        maxLength: 64
        pattern: '^[A-Za-z0-9._:-]+$'
      example: 6c1f3f5e-1d2a-4b3c-8d4e-5f6a7b8c9d0e
    UploadId:
      name: uploadId
      in: path
      required: true
      description: 上传会话 ID；当前实现使用 `document.id` 作为 `uploadId`。
      schema:
        type: string
        format: uuid
      example: 0192f3a4-9d4e-7f32-8a01-1234567890ab
    DocumentId:
      name: documentId
      in: path
      required: true
      description: 文档 ID；查询时必须同时匹配当前 userId。
      schema:
        type: string
        format: uuid
      example: 0192f3a4-9d4e-7f32-8a01-1234567890ab
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: |
        会话 ID。由 `POST /api/v1/conversations` 创建，或在首次问答时由客户端生成 UUIDv7
        并由服务端自动落库；已存在时必须属于当前用户，否则统一返回 404。
      schema:
        type: string
        format: uuid
      example: 0192f3a4-8c3d-7e21-8f90-abcdef123456
    ReminderId:
      name: reminderId
      in: path
      required: true
      description: |
        提醒 ID，必须与 `reminder.id` 精确匹配。它是**被操作的对象而非身份来源**：
        调用者是谁只由已验签 JWT 的 `sub` 决定。不属于当前用户与不存在返回同一个 404
        `REM-NOT_FOUND-001`，避免通过状态码差异探测他人提醒是否存在。
      schema:
        type: string
        format: uuid
      example: 0192f3a4-7b2c-7d10-9e8f-1234567890ab
    PageLimit:
      name: limit
      in: query
      required: false
      description: |
        每页条数，默认 20，上限 100。服务端实际多取 1 条用于判断是否还有下一页，
        因此响应 `items` 恰好为 `limit` 条且带 `nextCursor` 时表示还有后续页。
        越界返回 400 `COM-VALIDATION-001`，不做静默截断。
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      example: 20
    KeysetCursor:
      name: cursor
      in: query
      required: false
      description: |
        keyset 游标，取自上一页响应的 `nextCursor`，不透明、有时效语义。
        编码为 `base64url(排序毫秒|记录ID)`（无 padding）：文档与消息按 `created_at` 降序，
        提醒看板按 `next_trigger_at` 升序且「无下次触发」组排在最后，该组的游标排序键为空；
        通知列表按 `planned_trigger_at` 降序，该列 NOT NULL，因此不存在空排序键的末尾组；
        管理面配额列表按 `updated_at` 降序（`user_id` 作 tiebreak），审计查询按 `occurred_at` 降序
        （`id` 作 tiebreak），两者都是两列同序，用于让有序索引读取代替文件排序。
        客户端不得自行构造或篡改；非法、越界或跨接口复用的游标返回 400 `COM-VALIDATION-001`。
      schema:
        type: string
        maxLength: 200
        pattern: '^[A-Za-z0-9_-]+$'
      example: MTc5MjQ5MTM1MDEyM3wwMTkyZjNhNC05ZDRlLTdmMzItOGEwMS0xMjM0NTY3ODkwYWI
    DocumentStatusFilter:
      name: status
      in: query
      required: false
      description: 按文档状态机过滤；取值必须是 `DocumentStatus` 枚举成员，否则返回 400。
      schema:
        $ref: '#/components/schemas/DocumentStatus'
    DocumentSearchQuery:
      name: q
      in: query
      required: false
      description: |
        元数据子串搜索，大小写不敏感，同时匹配原始文件名 `fileName` 与展示标题 `title`，
        命中任一即算匹配。**不检索文档正文**——正文级检索的唯一入口是 `POST /api/v1/agent/ask` 的 RAG 链路。
        服务端按 `%…%` 前后通配匹配，靠 `userId` 把扫描范围压到当前用户的文档集合，
        因此本参数不保证大表性能；学生文档量级上升时应引入外部检索引擎，契约不承诺 `LIKE` 的响应时间上界。
        空值等价于不传（不返回空集，避免「清空搜索框」变成「查不到东西」）；超过 120 字符返回 400 `COM-VALIDATION-001`。
      schema:
        type: string
        minLength: 1
        maxLength: 120
      example: 梯度下降
    DocumentTagFilter:
      name: tag
      in: query
      required: false
      description: |
        按标签过滤，只接受**单个**标签名，按归一化形式（去首尾空白、连续空白折叠为单空格、小写）精确匹配。
        不支持多标签交集：`AND` 语义需要按标签集合做分组计数，在本期数据量与索引形状下没有收益，
        而 `OR` 语义会被客户端误当成 `AND` 使用，两者都不如让调用方自己翻两次页。
        标签不存在时返回**空页**而不是 404——标签名不是资源标识，列表接口没有「资源不存在」语义；
        返回 404 会让前端把「刚删完最后一个文档」误判为接口故障。
      schema:
        type: string
        minLength: 1
        maxLength: 24
      example: 考研数学
    ReminderStatusFilter:
      name: status
      in: query
      required: false
      description: 按提醒状态过滤；取值必须是 `ReminderStatus` 枚举成员，否则返回 400。
      schema:
        $ref: '#/components/schemas/ReminderStatus'
    NotificationUnreadFilter:
      name: unreadOnly
      in: query
      required: false
      description: |
        按是否未读过滤：`true` 只返回 `readAt` 为 null 的行，缺省或 `false` 返回全部。
        非布尔取值（如 `yes`、`1`）返回 400 `COM-VALIDATION-001`，不做真值猜测。

        与标记已读并用时有一个必须知道的语义：**过滤条件是每页重新求值的，不是快照**。
        用户边翻页边把看到的条目标为已读，已加载页的行会退出结果集，列表随之「缩短」；
        游标本身仍然有效，因为它锚定的是排序键（`plannedTriggerAt` + `id`）而不是偏移量。
      schema:
        type: boolean
      example: true
    UserId:
      name: userId
      in: path
      required: true
      description: |
        用户 ID，必须与 `app_user.id` 精确匹配。它是**路径参数而非身份来源**：
        调用者是谁只由已验签 JWT 的 `sub` 决定，本字段表示「对谁操作」，
        因此仅管理员端点接受它；任何面向普通用户的接口都不接受外部传入的 userId。
      schema:
        type: string
        format: uuid
      example: 0192f3a4-9d4e-7f32-8a01-1234567890ab
    ConnectionId:
      name: connectionId
      in: path
      required: true
      description: |
        模型连接 ID，必须与 `model_connection.id` 精确匹配。它是**路径参数而非身份来源**：
        调用者是谁、属于哪个租户只由已验签 JWT 决定，本字段表示「对哪条连接操作」。
        所有查询都带 `tenant_id` 谓词，因此别的租户的连接 ID 一律返回 404，不泄露其是否存在。
      schema:
        type: string
        format: uuid
      example: aaaaaaaa-0000-0000-0000-000000000001
    MemoryUserId:
      name: userId
      in: query
      required: true
      description: |
        被治理用户的 ID。它是查询条件而非身份来源：调用者是谁、属于哪个租户只由已验签 JWT 决定。
        记忆按 `(tenantId, userId)` 命名空间隔离，因此本参数必填——没有「查全租户记忆」的形态。
      schema:
        type: string
        format: uuid
      example: 0192f3a4-9d4e-7f32-8a01-1234567890ab
    MemoryKey:
      name: memoryKey
      in: path
      required: true
      description: |
        记忆条目的 key（数据面写入时生成的 UUID）。所有删除都带租户与用户谓词，
        别的租户或别的用户的 key 一律返回 404，不泄露其是否存在。
      schema:
        type: string
        format: uuid
      example: aaaaaaaa-0000-0000-0000-000000000001
    UserStatusFilter:
      name: status
      in: query
      required: false
      description: 按账号状态过滤；取值必须是 `UserStatus` 枚举成员，否则返回 400。
      schema:
        $ref: '#/components/schemas/UserStatus'
    UserRoleFilter:
      name: role
      in: query
      required: false
      description: |
        按角色过滤；取值必须是 `UserRole` 枚举成员，否则返回 400。
        多角色用户只要持有该角色即命中，不是「角色集合恰好等于该值」。
      schema:
        $ref: '#/components/schemas/UserRole'
    QuotaListLimit:
      name: limit
      in: query
      required: false
      description: |
        每页条数，默认 50，上限 200。管理面数据量小，允许比面向用户的 `PageLimit`（默认 20、上限 100）
        更大；这是独立参数而不是放宽全局 `PageLimit`，以免普通列表也接受 200 条。
        越界返回 400 `COM-VALIDATION-001`，不做静默截断。
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
      example: 50
    AuditQueryLimit:
      name: limit
      in: query
      required: false
      description: |
        审计查询每页条数，默认 100，上限 500，与 `audit-service` 既有的
        `query-default-limit` / `query-max-limit` 对齐。越界返回 400 `COM-VALIDATION-001`。
      schema:
        type: integer
        default: 100
        minimum: 1
        maximum: 500
      example: 100
    AuditTraceId:
      name: traceId
      in: query
      required: false
      description: |
        按 W3C trace id 精确过滤，与问答响应信封里的 `traceId` 同形；
        因此「一次问答为什么失败」可以用响应返回的那一个值直接定位其审计时间线。
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
      example: 4bf92f3577b34da6a3ce929d0e0e4736
    AuditUserId:
      name: userId
      in: query
      required: false
      description: 按事件归属用户精确过滤。它是查询条件而非身份来源；调用者是谁仍只由已验签 JWT 的 `sub` 决定。
      schema:
        type: string
        format: uuid
      example: 0192f3a4-9d4e-7f32-8a01-1234567890ab
    AuditEventType:
      name: eventType
      in: query
      required: false
      description: 按事件类型精确过滤，取值必须匹配事件类型正则；不提供前缀或模糊匹配，避免把治理查询变成全文检索。
      schema:
        type: string
        pattern: '^[A-Z][A-Z0-9_]{0,63}$'
      example: RAG_RETRIEVED
    TimeFrom:
      name: from
      in: query
      required: false
      description: |
        时间窗起点（含），RFC 3339 date-time。缺省为 `to - 24h`。
        必须早于 `to`，且与 `to` 的跨度不超过 31 天，否则返回 400 `COM-VALIDATION-001`。
      schema:
        type: string
        format: date-time
      example: '2026-11-02T09:00:00Z'
    TimeTo:
      name: to
      in: query
      required: false
      description: |
        时间窗终点（含），RFC 3339 date-time。缺省为服务端当前时刻。
        服务端按 UTC 解释；数据库连接时区固定为 `+00:00`，与 `occurred_at` / `started_at` 同口径。
      schema:
        type: string
        format: date-time
      example: '2026-11-03T09:00:00Z'
    UsageBucket:
      name: bucket
      in: query
      required: false
      description: |
        聚合粒度。当前只有 `day`（UTC 自然日）；保留该参数是为了将来增加 `hour` 时不必改变请求形态，
        客户端不应把「只有一个枚举值」理解为服务端会忽略它——传入其它值返回 400 `COM-VALIDATION-001`。
      schema:
        type: string
        enum:
          - day
        default: day
      example: day
    UsageTopUsers:
      name: topUsers
      in: query
      required: false
      description: |
        返回的 Top 用户数，默认 10，上限 50。排序为 `questions DESC, tokens DESC, userId ASC`，
        排序键完整因此同分用户之间的顺序稳定。越界返回 400 `COM-VALIDATION-001`。
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 50
      example: 10

  schemas:
    ApiEnvelope:
      type: object
      required:
        - code
        - msg
        - traceId
      properties:
        code:
          type: string
          enum:
            - OK
          description: 成功码固定为 OK；业务失败/错误响应不使用此信封。
        msg:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            给人看的描述文本，不参与任何判定。实现侧（`common` 的 `ApiResponse`）对所有成功响应固定输出 `success`；
            「是否幂等重放」读各 `data` 里的 `idempotentReplay`，「新建还是已存在」读 HTTP 状态码与 `data` 字段，不读 `msg`。
          example: success
        traceId:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: 32 位小写十六进制 W3C trace id。
          example: 4bf92f3577b34da6a3ce929d0e0e4736

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
          description: 演示账号用户名。
          example: demo
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          writeOnly: true
          description: 明文密码仅在请求中出现；最多 72 个 UTF-8 字节，避免 BCrypt 静默截断。
          example: change-me

    LoginData:
      type: object
      description: |
        令牌签发结果。刷新令牌**不出现**在本响应体中，只经 `Set-Cookie` 以 `HttpOnly` Cookie 下发；
        本对象因此可以安全地出现在前端内存与调试输出里，不含可长期驻留的凭据。
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
          description: |
            HS256 JWT：`sub` 为 userId，`roles` 为签发时的角色集合，有效期 15 分钟。
            客户端只能把它保存在内存中，禁止写入 `localStorage`、`sessionStorage`、Cookie 或日志。
        tokenType:
          type: string
          enum:
            - Bearer
          example: Bearer
        expiresIn:
          type: integer
          minimum: 1
          maximum: 900
          description: 访问令牌剩余有效期，单位秒；等于服务端配置的 access TTL（默认 15 分钟）。
          example: 900

    LoginEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/LoginData'

    CurrentUserData:
      type: object
      description: 当前访问令牌对应的身份视图；`username` 与 `status` 实时读自 `app_user`。
      required:
        - userId
        - username
        - status
        - roles
        - accessTokenExpiresIn
      properties:
        userId:
          type: string
          format: uuid
          description: 仅来自 JWT `sub`。
          example: 00000000-0000-0000-0000-000000000001
        username:
          type: string
          minLength: 3
          maxLength: 32
          example: demo
        status:
          $ref: '#/components/schemas/UserStatus'
        roles:
          type: array
          description: |
            签发该令牌时的角色集合。角色变更后本字段最长有一个 access TTL 的陈旧期，
            客户端不得把它当作即时收权手段（即时收权走账号停用）。
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/UserRole'
          example:
            - USER
            - ADMIN
        accessTokenExpiresIn:
          type: integer
          minimum: 1
          maximum: 900
          description: 当前访问令牌剩余有效秒数，供客户端据此安排静默续期。
          example: 843

    CurrentUserEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/CurrentUserData'

    UserRole:
      type: string
      description: |
        角色枚举。`USER` 是任何账号的必备角色，`ADMIN` 只额外授予管理面；
        新增角色必须同时扩展服务端权限判定，不接受运行时自由取值。
      enum:
        - USER
        - ADMIN
      example: USER

    UserStatus:
      type: string
      description: 账号状态。`DISABLED` 立即拒绝登录与刷新，并吊销既有凭据。
      enum:
        - ACTIVE
        - DISABLED
      example: ACTIVE

    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9_.-]{3,32}$'
          description: |
            字母、数字、下划线、点与连字符。允许大写输入，服务端 trim 后统一转小写，
            因此 `Zhang.Wei` 与 `zhang.wei` 视为同一账号，响应与后续登录都用归一化后的值。
          example: zhang.wei
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 10
          maxLength: 72
          pattern: '^(?=.*[A-Za-z])(?=.*\d).{10,72}$'
          description: |
            口令策略：至少 10 个字符、同时含字母与数字；上限 72 个 UTF-8 字节，
            因为 BCrypt 会静默丢弃第 72 字节之后的内容——不显式拒绝就会出现
            「长口令只有前 72 字节被校验」的安全幻觉。
          example: correct-horse-9

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 72
          description: 当前口令。缺失或不正确统一返回 401 并计入登录失败限流。
          example: correct-horse-9
        newPassword:
          type: string
          format: password
          writeOnly: true
          minLength: 10
          maxLength: 72
          pattern: '^(?=.*[A-Za-z])(?=.*\d).{10,72}$'
          description: 新口令，必须满足与注册相同的 `RegisterRequest.password` 策略。
          example: new-battery-11

    UserRolesUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - roles
      properties:
        roles:
          type: array
          maxItems: 2
          uniqueItems: true
          description: |
            目标角色的完整集合（整集替换）。空数组在 schema 层通过，由服务端按策略返回
            422 `USR-VALIDATION-001`：账号必须至少持有 `USER`，否则它会变成一个无法登录
            也无法被管理的死角账号；这是业务策略而不是请求格式错误。
          items:
            $ref: '#/components/schemas/UserRole'
          example:
            - USER
            - ADMIN

    UserStatusUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/UserStatus'

    UserSummaryData:
      type: object
      description: |
        管理员面的用户视图。刻意**不含** `password_hash`、刷新令牌摘要、Redis 键等任何凭据材料：
        管理员需要的是定位账号，不是接管账号。
      required:
        - userId
        - username
        - status
        - roles
        - createdAt
        - lastLoginAt
      properties:
        userId:
          type: string
          format: uuid
          example: 0192f3a4-9d4e-7f32-8a01-1234567890ab
        username:
          type: string
          minLength: 3
          maxLength: 32
          example: zhang.wei
        status:
          $ref: '#/components/schemas/UserStatus'
        roles:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-29T03:11:04.000Z'
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
          description: 从未登录过为 `null`；这是账号可用性判断里最有用的单一时间戳。
          example: '2026-10-29T03:11:04Z'

    UserEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/UserSummaryData'

    UserListData:
      type: object
      description: keyset 分页信封，与文档、提醒、会话、消息列表口径一致：有意不返回 `total`。
      required:
        - items
        - nextCursor
        - limit
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/UserSummaryData'
        nextCursor:
          type: string
          nullable: true
          maxLength: 200
          description: 下一页游标；为 `null` 表示已是最后一页。
          example: MTc5MjQ5MTM1MDEyM3wwMTkyZjNhNC05ZDRlLTdmMzItOGEwMS0xMjM0NTY3ODkwYWI
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: 本次实际生效的每页条数。
          example: 20

    UserListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/UserListData'

    UploadInitRequest:
      type: object
      additionalProperties: false
      required:
        - fileName
        - sizeBytes
        - contentType
        - md5
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^/\\\u0000-\u001F]+$'
          description: 原始文件名，不含路径分隔符和控制字符。
          example: calculus-notes.pdf
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 52428800
          description: 文件字节数，最大 50MiB。
          example: 10485760
        contentType:
          type: string
          enum:
            - application/pdf
            - application/vnd.openxmlformats-officedocument.presentationml.presentation
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - text/plain
          description: 仅允许 PDF、PPTX、DOCX、TXT。
          example: application/pdf
        md5:
          type: string
          pattern: '^[a-f0-9]{32}$'
          description: 客户端计算的小写 MD5；服务端在完成上传时复核。
          example: 0123456789abcdef0123456789abcdef

    PresignedPart:
      type: object
      required:
        - partNumber
        - url
        - expiresAt
      properties:
        partNumber:
          type: integer
          minimum: 1
          maximum: 10000
          example: 1
        url:
          type: string
          format: uri
          maxLength: 2048
          description: MinIO 预签名分片 URL；不得写入日志或审计。
          example: https://minio.example/upload/part/1
        expiresAt:
          type: string
          format: date-time
          description: URL 过期时间，默认 15 分钟。
          example: '2026-10-20T10:30:00Z'

    UploadInitData:
      type: object
      required:
        - documentId
        - uploadId
        - status
        - instantUpload
        - partSize
        - partCount
        - parts
        - idempotentReplay
      properties:
        documentId:
          type: string
          format: uuid
          example: 0192f3a4-9d4e-7f32-8a01-1234567890ab
        uploadId:
          type: string
          format: uuid
          description: 上传会话 ID；当前实现等于 documentId。
          example: 0192f3a4-9d4e-7f32-8a01-1234567890ab
        status:
          $ref: '#/components/schemas/DocumentStatus'
        instantUpload:
          type: boolean
          description: 为 true 时表示 MD5 秒传命中，`parts` 为空且无需调用 complete。
          example: false
        partSize:
          type: integer
          minimum: 5242880
          maximum: 5242880
          description: 固定分片大小 5MiB。
          example: 5242880
        partCount:
          type: integer
          minimum: 0
          maximum: 10
          description: 需要上传的分片数；秒传时为 0。
          example: 2
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: 上传会话过期时间；秒传时为 null。
          example: '2026-10-20T10:30:00Z'
        parts:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/PresignedPart'
        idempotentReplay:
          type: boolean
          description: 是否为同一 Idempotency-Key 的重放。
          example: false

    UploadInitEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/UploadInitData'

    CompleteUploadRequest:
      type: object
      additionalProperties: false
      required:
        - parts
      properties:
        parts:
          type: array
          minItems: 1
          maxItems: 10
          description: 按 partNumber 升序提交的全部分片；缺片、重复或 ETag 不匹配返回 422。
          items:
            $ref: '#/components/schemas/CompletedPart'

    CompletedPart:
      type: object
      additionalProperties: false
      required:
        - partNumber
        - etag
      properties:
        partNumber:
          type: integer
          minimum: 1
          maximum: 10000
          example: 1
        etag:
          type: string
          minLength: 1
          maxLength: 128
          description: MinIO 返回的分片 ETag，保留引号。
          example: '"5d41402abc4b2a76b9719d911017c592"'

    CompleteUploadData:
      type: object
      required:
        - documentId
        - uploadId
        - status
        - parseRequestedAt
        - retryCount
        - idempotentReplay
      properties:
        documentId:
          type: string
          format: uuid
        uploadId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/DocumentStatus'
        parseRequestedAt:
          type: string
          format: date-time
          description: 解析任务被事务性接收的时间；不代表解析完成。
        retryCount:
          type: integer
          minimum: 0
          maximum: 3
        idempotentReplay:
          type: boolean

    CompleteUploadEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/CompleteUploadData'

    DocumentStatus:
      type: string
      enum:
        - UPLOADED
        - PARSING
        - INDEXED
        - FAILED
        - DEAD
      description: 文档状态机，只由 document-service 推进。

    DocumentStatusData:
      type: object
      required:
        - documentId
        - fileName
        - title
        - tags
        - status
        - retryCount
        - maxRetry
        - indexVersion
        - chunkCount
        - vectorConsistency
        - createdAt
        - updatedAt
      properties:
        documentId:
          type: string
          format: uuid
        fileName:
          type: string
          maxLength: 255
          description: 原始文件名，不可变；进入解析事件与向量 metadata，不随重命名改变。
        title:
          type: string
          maxLength: 120
          nullable: true
          description: 用户可改的展示标题；为 null 时展示口径回退到 `fileName`（`title ?? fileName`）。
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 24
          description: |
            展示用标签名，取词表里保存的写法，**不暴露标签 ID**（本期不对外提供词表 ID，
            也就没有「把文档挂到他人标签上」的越权面）。恒为数组，无标签时是空数组而不是 null。
        status:
          $ref: '#/components/schemas/DocumentStatus'
        retryCount:
          type: integer
          minimum: 0
          maximum: 3
        maxRetry:
          type: integer
          minimum: 1
          maximum: 10
        errorCode:
          type: string
          maxLength: 64
          nullable: true
          description: 可公开展示的错误码；加密 PDF 为 DOC-VALIDATION-003。
          pattern: '^[A-Z]{2,4}-[A-Z_]+-[0-9]{3}$'
        errorMessage:
          type: string
          maxLength: 512
          nullable: true
          description: 仅可公开展示的安全文案，不含堆栈、路径、Prompt 或密钥。
        indexVersion:
          type: string
          minLength: 1
          maxLength: 32
          description: 当前**可检索**的索引版本；重建期间它继续指向旧版本，直到新版本写入成功才推进。
          example: v1
        pendingIndexVersion:
          type: string
          minLength: 1
          maxLength: 32
          nullable: true
          description: 重建在途的目标版本；非 null 表示 `indexVersion`、`chunkCount` 与向量确认仍是旧版本口径。
          example: v2
        chunkCount:
          type: integer
          minimum: 0
          description: 只统计与当前 `indexVersion` 一致的分块；其他状态下可为 0。
        vectorRows:
          type: integer
          minimum: 0
          nullable: true
          description: |
            向量侧最后一次确认的当前版本行数，由 Python 在写入或删除的同一事务内统计后回投。
            null 表示向量侧从未确认过（Worker 未回投，或该文档早于本字段上线就已索引），此时一致性为 `UNKNOWN`。
        vectorConfirmedAt:
          type: string
          format: date-time
          nullable: true
          description: 该确认发生的时刻，与 `vectorRows` 同批写入；它不是向量侧的实时状态。
        vectorConsistency:
          $ref: '#/components/schemas/VectorConsistency'
        indexedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    VectorConsistency:
      type: string
      enum:
        - MATCHED
        - DIVERGED
        - UNKNOWN
      description: |
        `chunkCount`（MySQL 当前版本行数）与 `vectorRows`（向量侧最后确认行数）的对照结论，三值成因不同，客户端应分别处理：
        `MATCHED` 两侧一致；`DIVERGED` 不一致，说明删除或旧版本清理尚未收敛；
        `UNKNOWN` 无从对照，**不代表有问题**。
        它是「最后一次确认」的对照而不是跨库实时比对，因此不得当作「向量已删除」的凭据——
        删除的即时事实是文档本身已从可读视图消失（404）。

    DocumentStatusEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/DocumentStatusData'

    DocumentRenameRequest:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: |
            展示标题，写入 `document.title`；`fileName` 不受本接口影响。
            服务端只做首尾空白剥离后判空，**不做其它字符清洗**：标题按原样回显给属主，
            渲染由前端负责，而前端红线禁止把标题当 HTML 注入（`v-html`）。
            空串、纯空白或超过 120 字符返回 400 `COM-VALIDATION-001`；
            传未知字段返回 400，避免客户端以为改了 `fileName` 而实际没改。
          example: 高等数学·第三章笔记

    DocumentTagsUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - tags
      properties:
        tags:
          type: array
          maxItems: 20
          description: |
            目标标签全集，**整集替换**语义；空数组表示清空该文档的全部标签。
            每项经归一化（去首尾空白 → 连续空白折叠为单空格 → 小写）后长度必须为 1–24，
            归一化后出现重复项返回 400 `COM-VALIDATION-001` 并携带 `fieldViolations`，**不静默去重**；
            超过 20 项同样整批拒绝，不截断。
            这里传标签名而不是标签 ID：本期不对外暴露词表 ID，服务端按 `(userId, 归一化名)` get-or-create。
          items:
            type: string
            minLength: 1
            maxLength: 24
          example:
            - 考研数学
            - 错题整理

    AskRequest:
      type: object
      additionalProperties: false
      required:
        - question
        - documentIds
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 4000
          description: 用户问题；服务端会先做 PII 第一层脱敏再进入 Python。
          example: 请解释第三章的梯度下降，并举一个例子。
        documentIds:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          description: |
            允许检索的文档 ID；必须全部属于当前用户、状态为 `INDEXED` 且**未被软删除**，否则返回 404。
            删除位必须单独校验：`deleted_at` 不改变 `status`，已删文档仍是 `INDEXED`，
            只判状态会让被删除的文档继续进入检索与引用回查。
          items:
            type: string
            format: uuid

    Citation:
      type: object
      required:
        - documentId
        - chunkIndex
        - score
        - snippet
      properties:
        documentId:
          type: string
          format: uuid
        chunkIndex:
          type: integer
          minimum: 0
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
        snippet:
          type: string
          maxLength: 200
          description: 不超过 200 字的原文片段；不得包含未授权文档内容。
        fileName:
          type: string
          maxLength: 255
          description: 可选展示文件名；不属于跨语言协议必带字段。

    BudgetStatus:
      type: string
      enum:
        - OK
        - BUDGET_EXHAUSTED
        - LOW_CONFIDENCE
      description: |
        OK：正常回答；BUDGET_EXHAUSTED：硬预算被触发；
        LOW_CONFIDENCE：证据不足。预算耗尽优先于低置信度。

    AskData:
      type: object
      required:
        - conversationId
        - messageId
        - answer
        - citations
        - confidence
        - budgetStatus
        - tokenUsed
        - toolCallsMade
        - roundsUsed
        - cacheHit
        - idempotentReplay
        - createdAt
      properties:
        conversationId:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
        answer:
          type: string
          maxLength: 8000
          description: 低置信度和预算耗尽时也必须是安全说明文本，不能编造引用。
        citations:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Citation'
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 低于 0.55 时 budgetStatus 必须为 LOW_CONFIDENCE。
        budgetStatus:
          $ref: '#/components/schemas/BudgetStatus'
        tokenUsed:
          type: integer
          minimum: 0
          maximum: 8000
        toolCallsMade:
          type: integer
          minimum: 0
          maximum: 3
        roundsUsed:
          type: integer
          minimum: 0
          maximum: 3
        cacheHit:
          type: boolean
          description: 缓存命中时 tokenUsed 为 0，但仍写 agent_execution。
        idempotentReplay:
          type: boolean
          description: 同一 Idempotency-Key 且问题相同的重放。
        createdAt:
          type: string
          format: date-time

    AskEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/AskData'

    AskStreamMeta:
      type: object
      description: |
        SSE 事件帧（`event: meta`）。帧序第一帧，恰好一次；`data` 为 JSON 对象。
      required:
        - event
        - data
      properties:
        event:
          type: string
          enum:
            - meta
        data:
          type: object
          required:
            - conversationId
            - messageId
            - traceId
            - cacheHit
          properties:
            conversationId:
              type: string
              format: uuid
            messageId:
              type: string
              format: uuid
              description: 助手消息 ID 在流首即固定，客户端本地行从第一刻起即可与服务端历史对账。
            traceId:
              type: string
              pattern: '^[0-9a-f]{32}$'
            cacheHit:
              type: boolean

    AskStreamDelta:
      type: object
      description: |
        SSE 事件帧（`event: delta`）。0..n 次；`data.text` 为纯增量文本（非快照），客户端按序拼接。
      required:
        - event
        - data
      properties:
        event:
          type: string
          enum:
            - delta
        data:
          type: object
          required:
            - text
          properties:
            text:
              type: string
              description: 回答文本增量；空串增量允许出现，客户端拼接语义不受影响。

    AskStreamDone:
      type: object
      description: |
        SSE 事件帧（`event: done`）。帧序最后一帧，恰好一次；`data` 为完整 `AskData` 同构字段
        + `traceId`，字段真源以本帧为准，客户端应以它整体替换本地拼接态。
      required:
        - event
        - data
      properties:
        event:
          type: string
          enum:
            - done
        data:
          allOf:
            - $ref: '#/components/schemas/AskData'
            - type: object
              required:
                - traceId
              properties:
                traceId:
                  type: string
                  pattern: '^[0-9a-f]{32}$'

    AskStreamError:
      type: object
      description: |
        SSE 事件帧（`event: error`）。至多一次，仅在 `meta` 帧已经下发之后才可能到达
        （替代 `done` 成为终止帧），其后流正常关闭；`data` 为 ProblemDetail 同构，
        错误码集合与首字节前的 JSON 拒绝完全一致。
      required:
        - event
        - data
      properties:
        event:
          type: string
          enum:
            - error
        data:
          $ref: '#/components/schemas/ProblemDetail'

    CreateConversationRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: 会话标题；省略时服务端使用默认标题“新会话”。
          example: 线性代数复习
        documentScopeIds:
          type: array
          maxItems: 20
          uniqueItems: true
          description: 可选，预置允许检索的文档 ID；必须全部属于当前用户，否则返回 404。
          items:
            type: string
            format: uuid

    ConversationData:
      type: object
      required:
        - conversationId
        - title
        - documentScopeIds
        - idempotentReplay
        - createdAt
      properties:
        conversationId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        documentScopeIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
        idempotentReplay:
          type: boolean
          description: 同一 Idempotency-Key 且请求指纹相同的重放。
        createdAt:
          type: string
          format: date-time

    CreateConversationEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/ConversationData'

    ReminderCreateRequest:
      oneOf:
        - $ref: '#/components/schemas/DeadlineReminderCreateRequest'
        - $ref: '#/components/schemas/CustomReminderCreateRequest'
      discriminator:
        propertyName: kind
        mapping:
          DEADLINE: '#/components/schemas/DeadlineReminderCreateRequest'
          CUSTOM: '#/components/schemas/CustomReminderCreateRequest'

    DeadlineReminderCreateRequest:
      type: object
      additionalProperties: false
      required:
        - kind
        - title
        - timezone
        - dueAt
      properties:
        kind:
          type: string
          enum:
            - DEADLINE
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: 提交线性代数作业
        description:
          type: string
          maxLength: 1000
          nullable: true
        timezone:
          type: string
          maxLength: 64
          pattern: '^UTC$|^[A-Za-z]+(?:/[A-Za-z0-9_+\-]+)+$'
          description: IANA 时区，如 Asia/Shanghai。
          example: Asia/Shanghai
        dueAt:
          type: string
          format: date-time
          description: 作业截止时间，UTC。
          example: '2026-10-25T15:59:59Z'
        leadMinutes:
          type: integer
          minimum: 0
          maximum: 10080
          default: 0
          description: 提前提醒分钟数；服务端据此计算 nextTriggerAt。
          example: 120

    CustomReminderCreateRequest:
      type: object
      additionalProperties: false
      required:
        - kind
        - title
        - timezone
        - rrule
        - dtstart
      properties:
        kind:
          type: string
          enum:
            - CUSTOM
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 1000
          nullable: true
        timezone:
          type: string
          maxLength: 64
          pattern: '^UTC$|^[A-Za-z]+(?:/[A-Za-z0-9_+\-]+)+$'
        rrule:
          type: string
          minLength: 6
          maxLength: 1024
          pattern: '^FREQ=(SECONDLY|MINUTELY|HOURLY|DAILY|WEEKLY|MONTHLY|YEARLY)(;[A-Z]+=[^;\r\n]+)*$'
          description: RFC 5545 RRULE；重复提醒只能一行表达。
          example: FREQ=WEEKLY;BYDAY=MO;UNTIL=20261231T235959Z
        dtstart:
          type: string
          format: date-time
          description: 首次触发基准时间，UTC。
          example: '2026-09-07T00:00:00Z'
        exdates:
          type: array
          maxItems: 365
          uniqueItems: true
          description: RFC 5545 EXDATE，统一为 UTC 时间字符串。
          items:
            type: string
            format: date-time

    ReminderKind:
      type: string
      description: |
        提醒的来源类型。**`COURSE` 只出现在读侧**（看板行与站内通知）：
        `ReminderCreateRequest` 的 `discriminator.mapping` 只登记 `DEADLINE` 与 `CUSTOM`，
        两个分支各自把 `kind` 钉成单值枚举，因此 `COURSE` 无法经创建接口产生，
        只能由 `POST /api/v1/reminders/ics/import` 落地。
        2.2.0 之前读侧把课表行统一压成 `CUSTOM`（`ReminderKind.fromSourceType` 的两值映射），
        看板因此无法区分「一节每周的课」与「一条自定义重复提醒」；2.3.0 起如实返回 `COURSE`。
      enum:
        - DEADLINE
        - CUSTOM
        - COURSE


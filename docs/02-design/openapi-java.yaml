          description: 标记完成，返回本次真正由空变有的行数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReadEnvelope'
              examples:
                marked:
                  summary: 两条变为已读
                  value:
                    code: OK
                    msg: success
                    data:
                      updated: 2
                      all: false
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736

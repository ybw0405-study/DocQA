  /api/v1/notifications/read:
    post:
      tags:
        - Notifications
      operationId: markNotificationsRead
      summary: 按 id 集合或全部标记通知已读
      description: |
        这是一个**收敛操作**：`read_at` 只在由空变有时写入，因此重复标记既不改写首次已读时刻，
        也不产生第二次副作用，本接口因此**不要求** `Idempotency-Key`（与所有写接口的要求相反，
        这是有意例外，理由见上）。

        `all=true` 与 `ids` 互斥，同时给出返回 400 `COM-VALIDATION-001`；`all=false` 时 `ids`
        至少给一个。「先取 id 再提交」不能替代 `all=true`，因为未加载页的未读项拿不到 id。

        越权或不存在的 id 不在更新集合内：**不返回 404，不逐项报告，也不泄露该 id 是否存在**。
        更新范围始终限定为 `userId` = 已验签 JWT 的 `sub`，不接受外部传入的用户标识。
        不计入用户级限流桶：它是本地一条 `UPDATE`，且用户「一键清红点」不应因为刚导入课表而被 429。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationReadRequest'
            examples:

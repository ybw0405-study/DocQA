  /api/v1/users/{userId}/roles:
    put:
      tags:
        - Users
      operationId: replaceUserRoles
      summary: 整集替换用户角色
      description: |
        需要 `ADMIN` 角色。用请求给出的集合替换该用户的全部角色，空集合非法。
        采用整集替换而非逐条增删，是为了让「一次授权变更」在服务端是单个原子写，
        避免两次并发增删互相覆盖后留下半套权限。

        两条自锁护栏，违反返回 422 `USR-VALIDATION-001`：
        其一，禁止把**当前调用者自己**的 `ADMIN` 摘掉——否则一次误操作就永久失去管理面；
        其二，禁止让任何用户落到零角色，账号必须至少持有 `USER`。
        角色变更不会吊销已签发的访问令牌：`roles` 声明在令牌里，生效延迟上限是 access TTL（15 分钟），
        这一取舍写入契约以免客户端把「改完立刻生效」当成可依赖行为；需要即刻收权应停用账号。
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:

                code: DOC-VALIDATION-004
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    ReminderValidation:
      description: RRULE、时区、时间或 EXDATE 非法
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            invalidRule:
              value:
                type: https://docqa.example/problems/reminder-validation
                title: Reminder rule validation failed
                status: 422
                detail: RRULE 或时区非法，请检查后重试。
                instance: /api/v1/reminders
                code: REM-VALIDATION-001
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            icsStructureError:
              summary: ICS 结构缺陷（2.2.0）
              value:
                type: https://docqa.example/problems/reminder-validation
                title: Reminder rule validation failed
                status: 422
                detail: ICS 解析失败，共 3 处问题，整批未导入。
                instance: /api/v1/reminders/ics/import
                code: REM-VALIDATION-001
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                errors:
                  - field: file.line.37
                    message: missing END:VEVENT for UID linear-algebra-2026-fall-mon-0800
                  - field: file.line.52
                    message: unsupported property RDATE is rejected, use RRULE with EXDATE
                  - field: file.line.61
                    message: UID exceeds 255 characters
      x-usage-note: |
        同一个组件服务两类 422：手工创建提醒时的规则非法，以及课表导入时的 ICS 解析缺陷。
        两者对调用方的动作相同（改正文件/请求再重试），因此不拆错误码；差异体现在 `errors[].field`：
        ICS 侧固定形如 `file.line.<物理行号>` 或 `file.uid.<UID>`，行号是**折行展开前**的原始行号，
        客户端可以据此在文本框里定位。`errors` 受 `maxItems: 20` 约束，
        超出部分只在 `detail` 里给出总数，不截断成「看起来只有 20 个问题」。

    ScheduleTooLarge:
      description: ICS 课表文件超过 2 MiB
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            tooLarge:
              value:
                type: https://docqa.example/problems/schedule-too-large
                title: Schedule file too large
                status: 413
                detail: 课表文件不能超过 2 MiB。
                instance: /api/v1/reminders/ics/import
                code: REM-VALIDATION-002
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
      x-usage-note: |
        与 `PayloadTooLarge`（50 MiB，文档上传）不共用：两个上限、两套客户端动作，
        合并会让前端无法决定该提示用户「删掉一些课」还是「换个文件」。
        业务侧字节判定与容器侧超限异常都返回本码；后者额外带一条 `errors[].field = file`，
        因为容器只知道「哪个 Part 太大」，而业务判定连字节数都能给出。

    ScheduleContentType:
      description: 上传部分的媒体类型不是 ICS/日历文本
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            unsupported:
              value:
                type: https://docqa.example/problems/schedule-content-type
                title: Unsupported schedule content type
                status: 415
                detail: 课表文件必须是 ICS 文本（text/calendar 或 application/octet-stream）。
                instance: /api/v1/reminders/ics/preview
                code: REM-VALIDATION-003
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
      x-usage-note: |
        只检查 `file` 部分的 Content-Type，不做扩展名判定：浏览器对 `.ics` 给出的类型在不同
        内核上分别是 `text/calendar`、`application/octet-stream` 或空值，只认 `text/calendar`
        会在 Safari 上稳定误拒。真正的格式合法性由解析器以 422 表达，本条只拦「传错了文件」。
        本码还覆盖**信封解析不开**这一种报文残缺：boundary 非法、Part 头缺失等 multipart 自身
        解析失败，`errors[].field` 为 `request`。必需 Part 缺失**不在此码**，按 400
        `COM-VALIDATION-001` 报告并把 Part 名放进 `errors[].field`（见 `ScheduleImportRequest`）。
        纯媒体类型拒绝没有 `errors`——此时客户端错的是「哪个文件」而不是「哪个字段」。

    ScheduleSourceConflict:
      description: 并发导入命中同一 (user_id, source_type, source_uid) 唯一键
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            sourceConflict:
              value:
                type: https://docqa.example/problems/schedule-source-conflict
                title: Schedule source conflict
                status: 409
                detail: 同一课程的导入请求正在进行，请稍后重试。
                instance: /api/v1/reminders/ics/import
                code: REM-CONFLICT-002
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
      x-usage-note: |
        与 `ReminderConflict`（`REM-CONFLICT-001`，幂等键复用）都是 409 但动作不同：
        本条是**唯一键竞态**，重试即可；`REM-CONFLICT-001` 要求调用方换 key 或换请求体。
        之所以单列一个码，是因为若不在异常处理里显式映射 `DuplicateKeyException`，
        它会落到 `Exception` 兜底变成 500，把一次可重试的并发冲突报成服务端故障。

    ReminderNotFound:
      description: 提醒不存在或不属于当前用户；统一返回 404，不暴露资源是否存在
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            notFound:
              value:
                type: https://docqa.example/problems/reminder-not-found
                title: Reminder not found
                status: 404
                detail: 提醒不存在。
                instance: /api/v1/reminders/0192f3a4-7b2c-7d10-9e8f-1234567890ae
                code: REM-NOT_FOUND-001
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
      x-usage-note: |
        REM 域此前没有 404：2.2.0 及之前的提醒路径只有创建、看板列表与课表导入，
        「按 ID 操作单个资源」在 2.3.0 才第一次出现。「ID 不存在」与「ID 存在但属于别人」
        返回**同一状态同一码**，与 `DocumentNotFound`（`DOC-NOT_FOUND-001`）同口径，
        否则调用方可以用状态码差异枚举他人的提醒 ID。`detail` 不含提醒标题或任何字段值。

    ReminderVersionConflict:
      description: 提交的 `version` 与当前行不一致，本次状态写入未发生
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            versionConflict:
              value:
                type: https://docqa.example/problems/reminder-version-conflict
                title: Reminder version conflict
                status: 409
                detail: 提醒已被更新，请刷新后重试。
                instance: /api/v1/reminders/0192f3a4-7b2c-7d10-9e8f-1234567890ae
                code: REM-CONFLICT-003
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
      x-usage-note: |
        本码是**乐观锁失败**，与 `ReminderConflict`（`REM-CONFLICT-001`，幂等键复用）和
        `ReminderStateConflict`（`REM-CONFLICT-004`，非法状态边）都是 409 但动作互不相同：
        本码要求「重读再决定」，`REM-CONFLICT-001` 要求「换 key 或换请求体」，
        `REM-CONFLICT-004` 要求「接受当前状态」。合并成一条会让前端只能弹一句万能文案。
        两种真实成因（别处改过 / 调度器刚推进过同一条提醒的 `version`）在此不区分：
        区分需要额外暴露触发时刻信息，而客户端动作完全一致，写在响应里只会被误当成可依赖的语义。

    ReminderStateConflict:
      description: 请求的状态迁移无法成立（终态出边或恢复时规则已无未来 occurrence），本次状态写入未发生
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            terminalEdge:
              value:
                type: https://docqa.example/problems/reminder-state-transition
                title: Reminder state transition conflict
                status: 409
                detail: 该提醒当前状态不允许此变更。
                instance: /api/v1/reminders/0192f3a4-7b2c-7d10-9e8f-1234567890ae
                code: REM-CONFLICT-004
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
      x-usage-note: |
        两种成因：①「终态改为其它状态」的六种请求（`COMPLETED`/`CANCELLED` → 另外三种非自身状态）；
        ② `PAUSED → ACTIVE` 但规则已无不早于当前时刻的 occurrence，恢复没有可满足的未来状态。
        同态提交是 200 no-op，版本过期是 `REM-CONFLICT-003`，两者都不落到本码。
        ①② 的判定都**先于** CAS，因此一条已完成的提醒即使带着正确的 `version` 也只会得到 409 本码，
        不会出现「版本对得上就允许把已完成改回进行中」这种倒退；② 不落库，提醒行保持 `PAUSED`。
        两种成因共用一个码是因为客户端动作相同：接受当前状态（②可选择把它完成或取消）。
        本码不用 422：请求体本身合法（`status` 是合法枚举值），错的是服务器上的当前状态与规则历史，
        而「客户端改不了、需要重读」的情形按既有口径一律 409。

    PiiBlocked:
      description: Python 第二层检测到 Java 漏脱敏，阻断本次 AI 调用
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

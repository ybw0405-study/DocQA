                code: AGT-UPSTREAM-004
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    ServiceUnavailable:
      description: AI 服务不可用、Kill Switch 打开，或 `audit_outbox` 无法写入
      content:

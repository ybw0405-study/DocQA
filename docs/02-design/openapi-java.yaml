  /api/v1/reminders/ics/preview:
    post:
      tags:
        - Reminders
      operationId: previewScheduleImport
      summary: 预览 ICS 课表导入的逐事件判定（不写入）
      description: |
        **只读语义的 POST**：解析上传的 ICS，与当前用户已有的 `COURSE` 提醒逐事件比对，
        返回 `CREATE` / `UPDATE` / `UNCHANGED` / `STALE` 四态判定，不写任何数据、不投递任何消息。
        拆成「预览 + 导入」两步的唯一理由，是验收判据「导入失败不得留下半套课表」必须能在写入之前判读。

        - 预览结果**不是承诺**：预览与导入之间另一浏览器或另一次导入会改变库内状态，
          最终以导入响应的 `items` 与四类计数为准。
        - `Idempotency-Key` 接受但**不消费**：传与不传响应相同，服务端不产生幂等记录。
          若在此写幂等表，用户「改了提前量再预览一次」会被指纹冲突误伤成 409，
          而预览本身没有任何需要防重复的副作用。
        - 结构性解析缺陷（缺 `END:VEVENT`、折行非法、`UID` 超长、出现 `RDATE` 或 `RECURRENCE-ID`、
          同一文件内 UID 重复等）返回 422，`errors` 给出**物理行号或 UID**，
          最多 20 条（受 `ProblemDetail.errors` 的 `maxItems` 约束），剩余条数在 `detail` 中汇总。
        - 与创建提醒共用同一用户级限流桶，预览与导入各计一次，因此反复点预览同样会被限流。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:

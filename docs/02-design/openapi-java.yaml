        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '409':
          $ref: '#/components/responses/DocumentConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Documents
      operationId: deleteDocument
      summary: 软删除文档并双侧清除其内容
      description: |
        软删除当前用户名下的文档。`userId` 取自 JWT `sub`，跨用户与已删除都返回 404。

        **一次 `DELETE` 覆盖三个动作**，因为它们必须一起发生才不会留下可检索的孤儿内容：
        MySQL 事务内删除该文档全部 `chunk` 行并置 `document.deleted_at`；事务提交后投递
        `vector-change-requested`（`operation=DELETE_DOCUMENT`）请求 Python 删除 PGVector 向量。
        注意**不是数据库级联**：`document` 行不删，所以 `chunk` 的 `ON DELETE CASCADE` 永不触发，
        删 `chunk` 必须由本接口显式完成。

        204 的语义边界必须读准：它表示 **MySQL 侧已不可见**——列表、状态、详情、秒传命中与问答检索范围
        立即排除该文档；它**不表示向量已删除**。向量侧收敛是异步的，由 `vector-change-completed` 回投确认。
        可判读的后果是历史会话里保存的引用：删除前发出的回答仍然显示，但按其 `vectorId` 回查正文会失败，
        这是「已删内容不得再被取出」的直接体现，不是缺陷。

        `status=PARSING` 时禁止删除，返回 409 `DOC-CONFLICT-001`。原因是竞态而非礼貌：解析在途时
        Python 正在写 `chunk` 与向量，删完之后到达的 `parse.completed` 会把内容写回，得到一个
        「已删除但仍被索引」的僵尸文档。作为第二道防线，`parse.completed` 落库前必须再次校验
        `deleted_at IS NULL`，命中即丢弃事件并确认。

        **不可恢复**：本期不提供 undelete。同一份内容（同 MD5）重新上传会撞上
        `uk_document_user_md5`，服务端读回原行发现 `deleted_at` 非空即返回 409，不复活旧行——
        复活意味着把已经双侧删除的内容重新当成有效索引，而那时向量侧是空的。
        `document_tag_link` 关联行**保留**（元数据关系属历史事实），`chunk` 行必须删除（内容派生物）。
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: |
            已软删除，无响应体。重复删除（不同 `Idempotency-Key`）返回 404，因为该文档已从可读视图消失；
            同一 key 的幂等重放仍返回 204。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '409':
          $ref: '#/components/responses/DocumentConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/documents/{documentId}/tags:
    put:
      tags:
        - Documents
      operationId: replaceDocumentTags
      summary: 整集替换文档标签
      description: |
        用请求给出的集合替换该文档的全部标签，空数组表示清空。`userId` 取自 JWT `sub`。

        采用整集替换而非逐条增删，与角色授予同一个理由：让「一次标签变更」在服务端是单个原子写，
        避免两次并发增删互相覆盖后留下半套标签。请求体传**标签名**而不是标签 ID——本期不向外暴露词表 ID，
        因此不存在「把自己的文档挂到他人标签上」的越权面；服务端按 `(userId, 归一化名)` get-or-create。

        归一化规则：去首尾空白 → 连续空白折叠为单个空格 → 小写（`Locale.ROOT`）。
        长度 1–24 的校验对**归一后**的串进行。**归一后重复的标签返回 400 而不是静默去重**：
        `"考研数学"` 与 `"考研数学 "` 同时出现说明客户端的集合构造有问题，静默去重会让它以为自己提交了两个标签。
        超过 20 个同样返回 400，整批拒绝，因为丢掉第 21 个标签会让客户端误以为已生效。

        本操作不触碰索引、不投递 MQ；文档处于任何非删除状态（含 `PARSING`、`FAILED`）都可以改标签。
        词表行 `document_tag` 不因某文档摘除标签而删除，允许零引用的悬挂标签。
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentTagsUpdateRequest'
            examples:
              replace:
                value:
                  tags:
                    - 考研数学
                    - 错题整理
              clear:
                value:
                  tags: []
      responses:
        '200':
          description: 标签已替换，返回变更后的文档视图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStatusEnvelope'
              examples:
                updated:
                  value:
                    code: OK
                    msg: success
                    data:
                      documentId: 0192f3a4-9d4e-7f32-8a01-1234567890ab
                      fileName: calculus-notes.pdf
                      title: 高等数学·第三章笔记
                      tags:
                        - 考研数学
                        - 错题整理
                      status: INDEXED
                      retryCount: 0
                      maxRetry: 3
                      errorCode: null
                      errorMessage: null
                      indexVersion: v1
                      pendingIndexVersion: null
                      chunkCount: 42
                      vectorRows: 42
                      vectorConfirmedAt: '2026-10-30T06:20:11Z'
                      vectorConsistency: MATCHED

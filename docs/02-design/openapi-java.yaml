  /api/v1/users/{userId}/status:
    patch:
      tags:
        - Users
      operationId: updateUserStatus
      summary: 启用或停用账号
      description: |
        需要 `ADMIN` 角色。部分更新，只改 `status`；`roles` 不由本接口触碰。

        停用（`DISABLED`）是**即时**的：服务端吊销该用户全部刷新令牌家族，并把用户级访问令牌吊销水位
        `auth:revoked:user:{userId}` 推进到当前时刻，使该用户在 `agent-gateway`、`document-service`、
        `reminder-service` 上的在途 access 一并被拒；后续任何刷新与 `/auth/me` 也因 `app_user.status`
        实时校验被拒。管理员调用时既不持有也不会知道目标用户的 `jti`，服务端同样没有按用户枚举在途
        access 的索引，所以即时收权只能靠水位而不是逐个撤销 `jti`。
        仅写一列状态而不吊销凭据，等于给已被盗用的账号留下最长 15 分钟的可用窗口，那与停用的目的相悖。
        禁止停用**当前调用者自己**（422 `USR-VALIDATION-001`），理由与角色自锁护栏相同。
        重新启用只恢复可登录性，不复活任何已吊销的凭据。
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusUpdateRequest'
            examples:
              disable:
                value:
                  status: DISABLED
      responses:
        '200':
          description: 状态已更新
          content:

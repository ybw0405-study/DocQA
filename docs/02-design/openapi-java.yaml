            schema:
              $ref: '#/components/schemas/UpdateAiQuotaRequest'
            examples:
              setBoth:
                value:
                  dailyQuestionLimit: 30
                  dailyTokenLimit: 60000
              clear:
                value:
                  dailyQuestionLimit: null
                  dailyTokenLimit: null
      responses:

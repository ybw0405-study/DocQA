  /api/v1/reminders/{reminderId}:
    patch:
      tags:
        - Reminders
      operationId: updateReminderStatus
      summary: 暂停、恢复、完成或取消单个提醒
      description: |
        本接口**只改状态**：标题、RRULE、时区与提前量都不在可改面内（改规则是另一个面，本期不提供）。
        状态机只有六条合法迁移边——`ACTIVE → PAUSED | COMPLETED | CANCELLED` 与
        `PAUSED → ACTIVE | COMPLETED | CANCELLED`；`COMPLETED` 与 `CANCELLED` 是终态，
        没有指向其它状态的出边，因此六条之外的六种请求一律返回 409 `REM-CONFLICT-004`，
        不先写库再报错，也不静默成功。撤销「已完成」需要重建一条提醒（代价登记在 `phase6-scope.md` D-58）。

        **同态提交是 no-op 而不是冲突**：`status` 等于当前状态时返回 200，不写库也不推进 `version`。
        响应里的 `version` 取**当前行的真实值**（未被推进），因此在「读到的版本还没过期」的正常情形下
        恰好等于请求提交的值；若客户端拿的是一份过期读出，它会看到比提交值更大的 `version`——
        这正是在告诉它自己读到的东西已经旧了，本接口不为此改成 409。
        理由是「确保它处于 X」重复提交应当成功——界面上连点两次「暂停」不该弹冲突；
        代价是客户端需要用 `version` 是否 +1 来判断本次是否真的改过。

        乐观并发：请求必须携带读到的 `version`，服务端以 `WHERE id = ? AND version = ?` 提交。
        版本不符返回 409 `REM-CONFLICT-003`，它有**两种真实成因**——别处改过，或者这条提醒刚刚
        触发过一次（调度器推进 `nextTriggerAt` 时同样 `version + 1`）。两种成因的客户端动作相同：重读再决定。

        `PAUSED → ACTIVE` 是**恢复而不是补发**：服务端按「不早于当前时刻的第一个 occurrence」重新求
        `nextTriggerAt`，暂停期间错过的 occurrence 一律不追溯触发、不写通知。
        规则已无不早于当前时刻的 occurrence 时（`COUNT` 用尽、`UNTIL` 已过、全部剩余日期被 EXDATE 排除，
        或一次性截止提醒的时点已过），「恢复」没有可满足的未来状态，返回 409 `REM-CONFLICT-004`
        且**不写入**——提醒行保持 `PAUSED`，用户仍可把它完成或取消。
        因此本接口成功响应里 `status = ACTIVE` 恒带非空 `nextTriggerAt`。
        `→ COMPLETED` 与 `→ CANCELLED` 会把 `nextTriggerAt` 置空，调度器的 `idx_reminder_due`
        扫描（谓词含 `status = 'ACTIVE'`）因此立即不再命中该提醒。

        幂等：`operation` 为 `REMINDER_UPDATE`，指纹为 `sha256(reminderId | status | version)`。
        同 key 同指纹返回首次响应且**不重复推进版本**（这是「请求成功但响应丢失」后重试的唯一正确语义），
        同 key 不同指纹返回 409 `REM-CONFLICT-001`。写操作计入用户级限流桶。

        判定顺序固定，五种结果不重叠：幂等守卫（重放或 409 `REM-CONFLICT-001`）之后
        ① 资源不存在或不属于当前用户 → 404 `REM-NOT_FOUND-001`；② 同态 → 200 no-op；
        ③ 终态出边 → 409 `REM-CONFLICT-004`；④ 恢复时规则已无未来 occurrence → 409 `REM-CONFLICT-004`（不写入）；
        ⑤ CAS 写入影响 0 行 → 409 `REM-CONFLICT-003`。
        ②不校验 `version`：没有写入需要被并发保护，而一份过期读出的「我要它暂停」
        在它确实已经暂停时陈述为真；③④ 都以读到的当前行为准，⑤ 才落到提交版本上，
        因此同一条提醒的「非法边」与「版本过期」不会同时命中——先按当前状态判边与重算，再按当前版本做 CAS。
      parameters:
        - $ref: '#/components/parameters/ReminderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderStatusUpdateRequest'
            examples:
              pause:
                summary: 暂停一条正在排期的课程提醒
                value:
                  status: PAUSED
                  version: 3
              resume:
                summary: 恢复为活跃（服务端重算下一次触发）
                value:
                  status: ACTIVE
                  version: 4
      responses:
        '200':
          description: 状态变更成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderStatusUpdateEnvelope'
              examples:
                resumed:
                  summary: 恢复后重算出的下一次触发
                  value:
                    code: OK
                    msg: success
                    data:
                      reminderId: 0192f3a4-7b2c-7d10-9e8f-1234567890ae
                      status: ACTIVE
                      nextTriggerAt: '2026-11-01T23:50:00Z'
                      version: 7
                      updatedAt: '2026-11-01T01:30:00Z'
                      idempotentReplay: false
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                completed:
                  summary: 完成一条提醒，下次触发置空
                  value:
                    code: OK
                    msg: success
                    data:
                      reminderId: 0192f3a4-7b2c-7d10-9e8f-1234567890ac
                      status: COMPLETED
                      nextTriggerAt: null
                      version: 6
                      updatedAt: '2026-11-01T09:31:00Z'
                      idempotentReplay: false
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ReminderNotFound'
        '409':
          description: 幂等键指纹冲突（REM-CONFLICT-001）、版本冲突（REM-CONFLICT-003）与非法状态边（REM-CONFLICT-004）三种不同成因共用 409
          oneOf:
            - $ref: '#/components/responses/ReminderConflict'
            - $ref: '#/components/responses/ReminderVersionConflict'
            - $ref: '#/components/responses/ReminderStateConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/notifications:
    get:
      tags:
        - Notifications
      operationId: listNotifications
      summary: 分页查询当前用户的站内通知
      description: |
        排序为 `planned_trigger_at DESC, id DESC`，即最近一次触发在最前；游标编码与排序键严格一致，
        格式非法或超出 `maxLength` 的游标返回 400 `COM-VALIDATION-001`。**游标不携带来源域标记**，
        因此把其它列表的游标拿到这里不会被识别、也就不会 400：它解码后只是一个锚点不属于本排序键的
        位置，表现为页错乱或空页；越权不可能因此发生，`user_id` 谓词独立于游标生效。

        每条通知对应一次**已发布的触发**（`reminder-due` 消息被本服务消费并落库的结果），
        不是提醒规则本身：同一条提醒可以有多条通知，`reminderId` 只是跳回看板的线索，
        提醒被完成或取消后**历史通知仍然保留**（通知是事实记录，不随提醒状态消失）。

        `title` 与 `description` 是提醒落库时的快照文本，不随提醒后续改名而变——
        通知要回答的是「当时响了什么」，不是「这条规则现在叫什么」。
        不提供未读数与总数：本契约的只读列表一律不做 `COUNT`。GET 是安全方法，不使用 `Idempotency-Key`。
      parameters:

# =============================================================================
# 批次 4 / SLO 定义与告警规则样例 — DocQA
# -----------------------------------------------------------------------------
# 【诚实边界】这是**样例**，未接入真实 Prometheus / Alertmanager，未采集任何
# 真实指标，也没有错误预算实测数据。指标名与标签按 §4.3 observability 与
# ai-python 的 prometheus-client 出口对齐；接入前需按真实 metric 名校准。
# 本文件为新增脚手架，不修改任何现有源码 / 脚本 / 配置 / ops/**。
#
# 用法（真实环境）：
# promtool check rules drill_slo_alerts.yaml
# 把 prometheus.rules 段挂到 rule_files；slo / error_budget 段供文档与看板消费。
# =============================================================================

slo:
  - name: ask_availability
    description: /agent/ask 非 5xx 比例
    sli: "1 - sum(rate(docqa_ask_requests_total{status=~'5..'}[5m])) / sum(rate(docqa_ask_requests_total[5m]))"
    target: 0.995
    window: 30d
  - name: ask_latency_p99
    description: /agent/ask 端到端 p99 延迟
    sli: "histogram_quantile(0.99, sum(rate(docqa_ask_latency_seconds_bucket[5m])) by (le))"
    target_seconds: 3.0
    window: 30d
  - name: tenant_isolation
    description: 租户隔离断言成功率（异租户命中必须为 0）
    sli: "sum(rate(docqa_tenant_isolation_checks_total{result='pass'}[5m])) / sum(rate(docqa_tenant_isolation_checks_total[5m]))"
    target: 1.0
    window: 30d
    note: "硬红线：任何一次异租户命中即视为 SLO 破线，优先级高于可用性与延迟"
  - name: parse_success_rate
    description: 文档解析 / 索引成功率
    sli: "sum(rate(docqa_parse_completed_total[5m])) / sum(rate(docqa_parse_requested_total[5m]))"
    target: 0.99
    window: 30d
  - name: pg_pool_saturation
    description: PG 连接池饱和度（B2 修复判据：并发上升连接数由池封顶）
    sli: "docqa_pg_pool_in_use / docqa_pg_pool_max_size"
    target_max: 0.85
    window: 30d
  - name: mq_backlog_drain
    description: MQ 堆积可回落（无 FAILED 永久 ACK / 无永久残留向量）
    sli: "docqa_mq_backlog_depth"
    target_max: 1000
    window: 30d
  - name: redis_readiness
    description: readiness 对 Redis 依赖的真实探测
    sli: "docqa_health_ready_status{component='redis'}"
    target: 1.0
    window: 30d

error_budget:
  policy: "30d 滚动窗口；任一级灰度消耗 > 20% 预算即停止晋级并评估回滚"
  alerts_reference: "见 prometheus.rules 中的 DocQAErrorBudgetBurn"
  # 本机未采集真实指标，以下为空基线占位
  baseline:
    measured: false
    note: "未接入真实 Prometheus，无错误预算实测值"

# ---- Prometheus 记录规则 + 告警规则（标准 rule 结构，可 promtool 校验）----
prometheus:
  groups:
    - name: docqa.drill.recording
      interval: 30s
      rules:
        - record: job:docqa_ask_error_rate:ratio_rate5m
          expr: "sum(rate(docqa_ask_requests_total{status=~'5..'}[5m])) / sum(rate(docqa_ask_requests_total[5m]))"
        - record: job:docqa_ask_p99:seconds
          expr: "histogram_quantile(0.99, sum(rate(docqa_ask_latency_seconds_bucket[5m])) by (le))"
        - record: job:docqa_pg_pool_saturation:ratio
          expr: "docqa_pg_pool_in_use / docqa_pg_pool_max_size"
        - record: job:docqa_tenant_isolation_pass:ratio_rate5m
          expr: "sum(rate(docqa_tenant_isolation_checks_total{result='pass'}[5m])) / sum(rate(docqa_tenant_isolation_checks_total[5m]))"

    - name: docqa.drill.alerts
      rules:
        - alert: DocQAAskHighErrorRate
          expr: "job:docqa_ask_error_rate:ratio_rate5m > 0.005"
          for: 5m
          labels:
            severity: critical
            team: docqa
            batch: "4"
          annotations:
            summary: "/agent/ask 5xx 率超过 SLO (0.5%)"
            description: "当前 {{ $value | humanizePercentage }}，持续 5m。检查 parse worker / PG / Redis。"
            runbook: "scripts/drill_canary_rollback_runbook.md 第 4 节"

        - alert: DocQAAskLatencyP99
          expr: "job:docqa_ask_p99:seconds > 3.0"
          for: 10m
          labels:
            severity: warning
            team: docqa
            batch: "4"
          annotations:
            summary: "/agent/ask p99 超过 3s"
            description: "当前 {{ $value }}s。结合 PG 连接池饱和度与 MQ 堆积一起看。"
            runbook: "scripts/drill_canary_rollback_runbook.md 第 3 节"

        - alert: DocQATenantIsolationBreach
          expr: "job:docqa_tenant_isolation_pass:ratio_rate5m < 1.0 OR increase(docqa_tenant_cross_hits_total[5m]) > 0"
          for: 0m
          labels:
            severity: critical
            team: docqa
            batch: "4"
          annotations:
            summary: "租户隔离断言破线（异租户命中 != 0）——最高优先级"
            description: "立即全量回滚，不要等待错误预算。"
            runbook: "scripts/drill_canary_rollback_runbook.md 第 4 / 5 节"

        - alert: DocQAMissingTenantWrite
          expr: "increase(docqa_missing_tenant_rejected_total[5m]) > 0"
          for: 1m
          labels:
            severity: critical
            team: docqa
            batch: "4"
          annotations:
            summary: "出现漏传 tenant_id 的写入（写侧代码与 005 收口不匹配）"
            description: "005 后 NOT NULL 无默认，漏传即报错；说明发布顺序或写侧接线有问题。"
            runbook: "修复执行报告.md 第 5 节 / drill_canary_rollback_runbook.md 第 5.1 节"

        - alert: DocQAPgPoolSaturation
          expr: "job:docqa_pg_pool_saturation:ratio > 0.85"
          for: 5m
          labels:
            severity: warning
            team: docqa
            batch: "4"
          annotations:
            summary: "PG 连接池饱和度 > 85%"
            description: "确认 open_pool() 单一组装根已接线、连接数未随 QPS 线性增长。"

        - alert: DocQAMqBacklog
          expr: "docqa_mq_backlog_depth > 1000"
          for: 10m
          labels:
            severity: warning
            team: docqa
            batch: "4"
          annotations:
            summary: "MQ 堆积不回落"
            description: "检查 FAILED 是否被永久 ACK、DLQ 与待清理版本对账。"

        - alert: DocQAReadinessDown
          expr: "docqa_health_ready_status == 0"
          for: 2m
          labels:
            severity: critical
            team: docqa
            batch: "4"
          annotations:
            summary: "readiness 非 200（PG / Redis 依赖 down）"
            description: "确认 LB 已摘除实例；依赖恢复后应自动回 200。"

        - alert: DocQAErrorBudgetBurn
          expr: "job:docqa_ask_error_rate:ratio_rate5m > 0.02"
          for: 5m
          labels:
            severity: warning
            team: docqa
            batch: "4"
          annotations:
            summary: "错误预算快速消耗，停止灰度晋级"
            description: "按 runbook 第 2 节停止放量并评估回滚。"

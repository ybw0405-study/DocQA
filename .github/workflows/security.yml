name: security

# 依赖漏洞与代码扫描门禁（G9）。
# - dependency-review：仅在 PR 上运行，比对依赖图变化，高危漏洞直接失败；
# - npm audit：只审运行时依赖（--omit=dev），high 及以上失败；
# - CodeQL：java-kotlin / javascript-typescript / python 三语言 matrix。
# 说明：action 引用已固定到联网核实过的 40 位 commit SHA（G6）。
# actions/dependency-review-action 远端没有 v4 滚动 tag（只有 v4.x.y），
# 因此固定到已核实的 v4.8.3 commit，避免 @v4 在 CI 上解析失败。
# dependency-review 依赖仓库启用 Dependency Graph（公开仓库默认开启）；
# CodeQL 上传结果需要 security-events: write，故在 codeql job 单独提升权限。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1'
  workflow_dispatch:

# 默认最小权限：只读源码
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  npm-audit:
    name: npm audit (prod deps, high)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json
      - name: npm audit --omit=dev --audit-level=high
        working-directory: frontend-vue
        run: |
          npm ci --omit=dev
          npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CodeQL 需要把扫描结果写入 code scanning：单独提升 security-events 写权限
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
      # java-kotlin 由 autobuild 探测 backend-java/pom.xml 的多模块 Maven 构建；
      # javascript-typescript / python 为解释型，autobuild 为空操作。
      - uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

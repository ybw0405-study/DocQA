name: CI

# Three gates plus a cross-service boundary e2e, one job each. They are
# intentionally independent so a Python failure cannot mask a Java regression.
#
# Infrastructure boundary: the Python job runs a pgvector PostgreSQL service
# container (pinned by digest) so the three real-SQL tenant contract tests in
# test_pg_contract.py execute instead of skipping; DOCQA_TEST_PG_DSN points at it
# and a gate step asserts all 3 PASS. The Java job runs `./mvnw verify`, and
# MigrationOnRealMysqlTest starts its own MySQL 8.4 container via Testcontainers.
# G19: DOCQA_DB_IT is explicitly set to `on` and a junit gate asserts that class
# actually ran (tests>0, skipped==0) — the whole class can no longer be skipped
# away by DOCQA_DB_IT=off. cross-service-e2e runs the three real cross-service
# boundaries on every event including main; see that job's comment for the honest
# boundary of what "full HTTP chain" coverage is still local-only.
#
# A full five-service HTTP chain (with a real second tenant and MQ) remains the
# local drill scripts/e2e-dual-tenant-drill.sh; this workflow does not claim it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    name: Java 17 / mvn verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # G19：禁止通过 DOCQA_DB_IT=off / false 整类跳过真库迁移测试；
      # 显式标记并由下面的 junit 门禁断言该类真实执行、零 skip。
      DOCQA_DB_IT: 'on'
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'  # G12：与 .java-version / backend-java/pom.xml 一致
          cache: maven
      - name: 显式标记真库门禁（G19）
        run: |
          {
            echo '### 真库迁移门禁'
            echo 'DOCQA_DB_IT=on：MigrationOnRealMysqlTest 不允许整类 skip；'
            echo 'junit 门禁断言该类 tests>0、skipped=0、failures+errors=0。'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify (tests + Checkstyle + ArchUnit)
        run: bash ../mvnw -B -ntp verify
      - name: Real-MySQL migration gate (must run, not skip)
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          files = glob.glob('**/target/surefire-reports/TEST-*MigrationOnRealMysqlTest*.xml', recursive=True)
          if not files:
              print('未找到 MigrationOnRealMysqlTest 的 surefire 报告（整类未执行）', file=sys.stderr)
              sys.exit(1)
          tests = failures = errors = skipped = 0
          for path in files:
              for suite in ET.parse(path).getroot().iter('testsuite'):
                  tests += int(suite.get('tests', 0))
                  failures += int(suite.get('failures', 0))
                  errors += int(suite.get('errors', 0))
                  skipped += int(suite.get('skipped', 0))
          print(f'MigrationOnRealMysqlTest: tests={tests} failures={failures} errors={errors} skipped={skipped}')
          if tests == 0 or skipped > 0 or failures + errors > 0:
              print('真库迁移门禁失败：该类必须真实执行且全部通过，不允许整类 skip。', file=sys.stderr)
              sys.exit(1)
          print('真库迁移门禁通过：MigrationOnRealMysqlTest 在真实 MySQL 上全部执行。')
          PY
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: backend-java/**/target/surefire-reports
          retention-days: 7

  python:
    name: Python / pytest + ruff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: docqa
          POSTGRES_PASSWORD: docqa_test_pw
          POSTGRES_DB: docqa_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U docqa -d docqa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ai-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version  # G12：单一来源
          cache: pip
          cache-dependency-path: ai-python/requirements.lock.txt  # G20：绑定真实锁文件
      - name: Install (locked + verified hashes)
        # G15：锁文件由 ops/gen-requirements-hashes.py 生成，含 PyPI 真实 sha256；
        # --require-hashes 强制逐包校验。项目本体单独 --no-deps -e . 安装。
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock.txt
          pip install --no-deps -e .
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pytest
        env:
          DOCQA_TEST_PG_DSN: postgresql://docqa:docqa_test_pw@localhost:5432/docqa_test
        run: pytest -p no:warnings -q
      - name: PG contract gate (3 cases must PASS, not SKIP)
        env:
          DOCQA_TEST_PG_DSN: postgresql://docqa:docqa_test_pw@localhost:5432/docqa_test
        run: |
          pytest -p no:warnings -q tests/test_pg_contract.py --junitxml=pg-contract-junit.xml
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("pg-contract-junit.xml").getroot()
          suites = list(root.iter("testsuite"))
          if not suites:
              print("PG contract gate FAILED: no <testsuite> in junit xml.", file=sys.stderr)
              sys.exit(1)
          tests = failures = errors = skipped = 0
          for suite in suites:
              tests += int(suite.get("tests", 0))
              failures += int(suite.get("failures", 0))
              errors += int(suite.get("errors", 0))
              skipped += int(suite.get("skipped", 0))
          print(f"PG contract junit: tests={tests} failures={failures} errors={errors} skipped={skipped}")
          if skipped > 0 or tests != 3 or failures + errors > 0:
              print("PG contract gate FAILED: expected 3 PASS on real pgvector, got a skip/failure/error.", file=sys.stderr)
              sys.exit(1)
          print("PG contract gate OK: 3/3 passed on real pgvector PostgreSQL.")
          PY

  frontend:
    name: Node / typecheck + lint + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-vue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc  # G12：单一来源
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json  # G20：真实锁文件
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests (jsdom + contract drift + redlines)
        run: npm run test
      - name: Build
        run: npm run build

  # G19：新增跨服务 e2e job。无 if 条件 —— push main / PR / workflow_dispatch
  # 一律必跑，主分支当然在内。三条边界都用真实依赖与真实测试产物，不是恒真断言：
  #   1) Java↔Python 的 MQ 信封契约（ParseWorkerProtocolContractTest，真实 JUnit）；
  #   2) Python↔PG 的真实 SQL 契约（test_pg_contract.py + 真实 pgvector service）；
  #   3) Frontend↔Java 的 OpenAPI 契约漂移（真实 vitest）。
  # 诚实边界：五个 Java 服务 + Python + MQ 的完整 HTTP 全链（含第二个真实租户）
  # 仍是 scripts/e2e-dual-tenant-drill.sh 的本地演练，需要真实中间件；本 job 不
  # 假装已覆盖该全链，但把「三端各自全绿、跨进程边界却无人验证」的真空补上。
  cross-service-e2e:
    name: 跨服务边界 e2e（三条真实边界）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      pgvector:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: docqa
          POSTGRES_PASSWORD: docqa_test_pw
          POSTGRES_DB: docqa_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U docqa -d docqa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: ai-python/requirements.lock.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json

      - name: 边界 1/3 — Java↔Python MQ 信封契约（真实 JUnit）
        run: |
          bash ./mvnw -f backend-java/pom.xml -B -ntp \
            -pl document-service -am \
            -Dtest=ParseWorkerProtocolContractTest \
            -Dsurefire.failIfNoSpecifiedTests=false test

      - name: 边界 2/3 — Python↔PG 真实 SQL 契约（真实 pgvector）
        env:
          DOCQA_TEST_PG_DSN: postgresql://docqa:docqa_test_pw@localhost:5432/docqa_test
        run: |
          pip install --require-hashes -r ai-python/requirements.lock.txt
          pip install --no-deps -e ./ai-python
          cd ai-python
          pytest -p no:warnings -q tests/test_pg_contract.py --junitxml=pg-contract-junit.xml
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse("pg-contract-junit.xml").getroot()
          suites = list(root.iter("testsuite"))
          tests = failures = errors = skipped = 0
          for suite in suites:
              tests += int(suite.get("tests", 0))
              failures += int(suite.get("failures", 0))
              errors += int(suite.get("errors", 0))
              skipped += int(suite.get("skipped", 0))
          print(f"cross-service PG boundary: tests={tests} failures={failures} errors={errors} skipped={skipped}")
          if not suites or skipped > 0 or tests != 3 or failures + errors > 0:
              print("跨服务 PG 边界失败：期望 3/3 真实执行通过。", file=sys.stderr)
              sys.exit(1)
          PY

      - name: 边界 3/3 — Frontend↔Java OpenAPI 契约漂移（真实 vitest）
        working-directory: frontend-vue
        run: |
          npm ci
          npx vitest run tests/contract-drift.spec.ts

name: CI

# Three gates, one job each. They are intentionally independent so a Python
# failure cannot mask a Java regression and vice versa.
#
# Infrastructure boundary (D4): no externally provisioned MySQL / Redis / RocketMQ /
# MinIO / PGVector service is required by any job. The Java job runs `mvn verify`,
# and `MigrationOnRealMysqlTest` starts its own MySQL 8.4 container via Testcontainers
# whenever Docker is available (GitHub-hosted runners are), executing V1→V10 for real
# plus the tenant-scoped repository predicates and the bootstrap INSERT IGNORE replay.
# Set DOCQA_DB_IT=off to skip that class on a runner without Docker; it is skipped,
# not failed, by an in-test Assumptions guard. What is deliberately NOT part of CI is
# a full-chain HTTP end-to-end run across all three services + MQ (decision D4);
# that still requires a manually started local stack and a real second tenant.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    name: Java 17 / mvn verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify (tests + Checkstyle + ArchUnit)
        run: mvn -B -ntp verify
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: backend-java/**/target/surefire-reports
          retention-days: 7

  python:
    name: Python 3.12 / pytest + ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-python/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pytest
        run: pytest -p no:warnings -q

  frontend:
    name: Node 22 / typecheck + lint + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-vue
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests (jsdom + contract drift + redlines)
        run: npm run test
      - name: Build
        run: npm run build

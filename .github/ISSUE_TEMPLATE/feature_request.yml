name: 功能建议
description: 提出一个可落地的功能或改进建议
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请先搜索现有 Issue，并说明这个需求解决的是什么问题，而不只是实现方式。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前哪里不方便？影响哪些使用场景？
      placeholder: 作为……，我希望……，因为……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的行为、接口或交互；如果涉及契约/数据库变更请注明
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与取舍
      description: 你考虑过的其他做法，以及为什么不选它们
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 前端
        - Java 控制面
        - Python 数据面
        - 跨端契约 / 数据库
        - 文档 / 工程化
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: breaking
    attributes:
      label: 兼容性
      options:
        - label: 该变更可能破坏现有接口、数据或配置
          required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考实现、截图、相关链接等
    validations:
      required: false

version: 2
updates:
  # 依赖升级策略：
  # - 每个生态按月检查，最多同时 2 个 PR；
  # - 次版本/补丁版本按生态聚合成一个 PR；
  # - Maven / pip / npm 忽略主版本升级（由维护者手工评估），
  # GitHub Actions 的主版本升级仍自动跟进。
  - package-ecosystem: "maven"
    directory: "/backend-java"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(java)"
    labels:
      - "dependencies"
    groups:
      maven-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Spring Boot / Cloud 的 minor 是 feature train，跨 train 有传递依赖断裂等
      # 破坏性变化（PR #30 实证：boot 3.3→3.5 致 MinIO 的 okhttp 类缺失）；
      # jjwt 处于 0.x，minor 即 breaking。三者只放行 patch，train 升级手工迁移。
      - dependency-name: "org.springframework.boot:*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "org.springframework.cloud:*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "io.jsonwebtoken:*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: "pip"
    directory: "/ai-python"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(python)"
    labels:
      - "dependencies"
    groups:
      pip-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "/frontend-vue"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(frontend)"
    labels:
      - "dependencies"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci(actions)"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"

  # 仅安全更新，不做版本更新 PR：复合 tag 会让 dependabot 漏判运行时大版本
  # （PR #34 实证：maven:3.9-eclipse-temurin-17→26 只被识别为 maven 3.9 的 patch，
  # 实为 Java 17→26；python 3.12→3.15 同样与钉扎的运行时矩阵脱节）。
  # 基础镜像升级由维护者手工评估并按真实 digest 钉扎（Dockerfile 与 compose 同策）。
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(docker)"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

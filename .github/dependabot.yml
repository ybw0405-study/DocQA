version: 2
updates:
  # 依赖升级策略：
  # - 每个生态按月检查，最多同时 2 个 PR；
  # - 次版本/补丁版本按生态聚合成一个 PR；
  # - Maven / pip / npm 忽略主版本升级（由维护者手工评估），
  #   GitHub Actions 的主版本升级仍自动跟进。
  - package-ecosystem: "maven"
    directory: "/backend-java"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(java)"
    labels:
      - "dependencies"
    groups:
      maven-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "pip"
    directory: "/ai-python"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(python)"
    labels:
      - "dependencies"
    groups:
      pip-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "/frontend-vue"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(frontend)"
    labels:
      - "dependencies"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci(actions)"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"

  # 仓库当前没有任何 Dockerfile（G17 待办）；以 "/" 作为占位目录。
  # ops/docker-compose.infra.yml 的镜像版本目前由人工维护（G16 计划改 digest 固定），
  # 待新增 Dockerfile 后此生态会自动纳入版本跟踪，届时按实际路径调整 directory。
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(docker)"
    labels:
      - "dependencies"

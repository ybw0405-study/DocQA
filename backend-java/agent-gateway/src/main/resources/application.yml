server:
  port: 8080

spring:
  application:
    name: agent-gateway
  servlet:
    multipart:
      # 网关只做透传，不能自己解析 multipart：解析后请求被包装成 MultipartHttpServletRequest，
      # 原始输入流已被消费，转发给文档服务与提醒服务的就成了空 body。
      enabled: false
  main:
    web-application-type: servlet
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DOCQA_DB_URL:jdbc:mysql://127.0.0.1:3306/docqa?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8}
    username: ${DOCQA_APP_DB_USERNAME:${DOCQA_DB_USERNAME:}}
    password: ${DOCQA_APP_DB_PASSWORD:${DOCQA_DB_PASSWORD:}}
    hikari:
      maximum-pool-size: 10
      connection-init-sql: "SET time_zone = '+00:00'"
  flyway:
    enabled: false
  data:
    redis:
      host: ${DOCQA_REDIS_HOST:127.0.0.1}
      port: ${DOCQA_REDIS_PORT:6379}
      password: ${DOCQA_REDIS_PASSWORD:}
      database: ${DOCQA_REDIS_DATABASE:0}
      timeout: 3s
      connect-timeout: 3s
  cloud:
    gateway:
      mvc:
        routes:
          - id: user-service
            uri: ${DOCQA_USER_SERVICE_URI:http://127.0.0.1:8081}
            predicates:
              - Path=/api/v1/auth/**,/api/v1/users/**
          - id: document-service
            uri: ${DOCQA_DOCUMENT_SERVICE_URI:http://127.0.0.1:8082}
            predicates:
              - Path=/api/v1/documents/**
          - id: reminder-service
            uri: ${DOCQA_REMINDER_SERVICE_URI:http://127.0.0.1:8083}
            predicates:
              # 通知与提醒同服务：Path 必须与契约的 /api/v1/notifications 面一起改，配错表现为 404 而非启动失败。
              - Path=/api/v1/reminders/**,/api/v1/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # 与三个业务服务对齐：liveness 只看进程自身；readiness 纳入 db/redis
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,redis

docqa:
  jwt:
    issuer: docqa-user-service
    audience: docqa-api
    secret: ${DOCQA_JWT_SECRET:}
  agent:
    rate-limit-window: 120s
    rate-limit-max-requests: 20
    conversation-lock-ttl: 30s
    idempotency-in-progress-ttl: 60s
    idempotency-result-ttl: 24h
    qa-cache-ttl: 10m
    budget-ttl: 30m
    state-ttl: 30m
    history-limit: 6
    history-max-chars: 8000
    kill-switch-cache-ttl: 30s
    prompt-version: p1
    max-citations: 20
    low-confidence-threshold: 0.55
  python:
    base-url: ${DOCQA_PYTHON_BASE_URL:http://127.0.0.1:8000}
    connect-timeout: 2s
    response-timeout: 15500ms
    deadline: 15s
    token-budget: 8000
    max-tool-calls: 3
    max-rounds: 3
    prompt-version: p1
    masking-version: pii-v2
    # HMAC 共享密钥（与 ai-python DOCQA_AI_INTERNAL_HMAC_SECRET 同值）。非空时按
    # HmacSigner 规范签名，Python 侧以签名为唯一凭据；空 = 静态 token 兼容期（dev/local）。
    internal-hmac-secret: ${DOCQA_AI_INTERNAL_HMAC_SECRET:}
    allowed-tools:
      - document_search
      - calculator
      - current_time
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 20
      minimum-number-of-calls: 10
      wait-duration-in-open-state: 30s
      permitted-number-of-calls-in-half-open-state: 3
  ai:
    model-connection:
      # 凭据主密钥（base64 的 32 字节）。留空 = 未配置：网关照常启动，
      # 只有「保存 API Key」与「测试连接」会被明确拒绝，不影响其它任何功能。
      # 与 Python 数据面读同一个变量名，两侧必须拿到同一把密钥，否则密文解不开。
      master-key: ${DOCQA_CRED_MASTER_KEY:}
      # 轮换前的旧主密钥（逗号分隔），只用于解封历史密文；新写入一律用当前主密钥。
      previous-keys: ${DOCQA_CRED_MASTER_KEY_PREVIOUS:}
      # 出网主机后缀白名单（逗号分隔）；空 = 放行任意公网主机。与数据面同一份取值。
      allowed-hosts: ${DOCQA_LLM_ALLOWED_HOSTS:}
      # 回环/私网放行开关：本地 Ollama 这类自托管端点需要显式打开，默认拒绝。
      allow-private: ${DOCQA_LLM_ALLOW_PRIVATE:false}
      key-prefix: "agent:model-connection:tenant:"
      probe-timeout: 5s
      probe-max-bytes: 262144
  admin:
    # 管理动作只写这两个键的元数据 / 只读账本；主键 agent:kill-switch 仍由 KillSwitch 统一读写
    kill-switch-meta-key: agent:kill-switch:meta
    experiment-budget-key: agent:budget:session-tokens
  observability:
    # LangFuse UI 根地址，只下发给管理面拼追踪链接；留空 = 禁用（审计页 traceId 保持纯文本）。
    langfuse-base-url: ${DOCQA_LANGFUSE_BASE_URL:}
  audit:
    enabled: ${DOCQA_AUDIT_ENABLED:true}
    namesrv: ${DOCQA_ROCKETMQ_NAMESRV:127.0.0.1:9876}
    producer-group: agent-gateway-audit-producer
    topic: audit-event
    send-timeout: 3s
    relay-interval-ms: 5000
    relay-batch-size: 100
    # 网关也会直接往 audit_event 追加管理端事件（JdbcAdminAuditRepository），
    # 所以它同样要被这条判据看住：能写，但不能改。
    append-only-guard: ${DOCQA_AUDIT_APPEND_ONLY_GUARD:enforce}

logging:
  level:
    com.docqa.agentgateway: INFO
  # 租户/链路标签走 MDC：TenantContext.set 写 tenantId，TraceIdFilter 写 traceId
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p ${PID:- } --- [%15.15t] %-40.40logger{39} traceId=%X{traceId:-} tenantId=%X{tenantId:-} : %m%n"

server:
  port: 8082

spring:
  application:
    name: document-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DOCQA_DB_URL:jdbc:mysql://127.0.0.1:3306/docqa?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8}
    username: ${DOCQA_APP_DB_USERNAME:${DOCQA_DB_USERNAME:}}
    password: ${DOCQA_APP_DB_PASSWORD:${DOCQA_DB_PASSWORD:}}
    hikari:
      maximum-pool-size: 10
      connection-init-sql: "SET time_zone = '+00:00'"
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 迁移用独立凭据：Flyway 需要 DDL，运行期服务不需要。两者共用同一个连接池会把
    # 「建表能力」常驻在进程里，等于把最小权限收敛的结果又退回去。
    # 未配置时回退到管理员账号，行为与改造前一致。
    user: ${DOCQA_MIGRATOR_DB_USERNAME:${DOCQA_DB_USERNAME:root}}
    password: ${DOCQA_MIGRATOR_DB_PASSWORD:${DOCQA_DB_PASSWORD:}}
    baseline-version: 1
    validate-on-migrate: true
  data:
    redis:
      host: ${DOCQA_REDIS_HOST:127.0.0.1}
      port: ${DOCQA_REDIS_PORT:6379}
      password: ${DOCQA_REDIS_PASSWORD:}
      database: ${DOCQA_REDIS_DATABASE:0}
      timeout: 3s
      connect-timeout: 3s

docqa:
  jwt:
    issuer: docqa-user-service
    audience: docqa-api
    secret: ${DOCQA_JWT_SECRET:}
  minio:
    enabled: ${DOCQA_MINIO_ENABLED:true}
    endpoint: ${DOCQA_MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${DOCQA_MINIO_ACCESS_KEY:}
    secret-key: ${DOCQA_MINIO_SECRET_KEY:}
    bucket: ${DOCQA_MINIO_BUCKET:docqa-documents}
    part-size: 5242880
    presign-expiry: 15m
  rocketmq:
    enabled: ${DOCQA_ROCKETMQ_ENABLED:true}
    namesrv: ${DOCQA_ROCKETMQ_NAMESRV:127.0.0.1:9876}
    producer-group: document-service-producer
    consumer-group: document-service-parse-result
    vector-result-consumer-group: document-vector-result
    parse-requested-topic: parse-requested
    parse-completed-topic: parse-completed
    parse-failed-topic: parse-failed
    vector-change-requested-topic: vector-change-requested
    vector-change-completed-topic: vector-change-completed
    send-timeout-ms: 3000
  document:
    session-ttl: 45m
    idempotency-ttl: 24h
    mq-idempotency-ttl: 7d
    reconcile-interval-ms: 300000
    reconcile-initial-delay-ms: 60000
    stale-threshold: 10m
    reconcile-batch-size: 50
    default-max-retry: 3
    index-version: v1

logging:
  level:
    com.docqa.document: INFO
  # 租户/链路标签走 MDC：TenantContext.set 写 tenantId，TraceIdFilter 写 traceId
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p ${PID:- } --- [%15.15t] %-40.40logger{39} traceId=%X{traceId:-} tenantId=%X{tenantId:-} : %m%n"

management:
  endpoints:
    web:
      # 只暴露运维必需的三个端点；env / beans / heapdump 等敏感端点保持关闭
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # liveness 只看进程自身；readiness 探真实依赖 db/redis/mq/minio，下游不可用时如实摘流
      # （/ DQ-3 后半）。mq 与 minio 由 DependencyHealthConfiguration 注册，短超时 500ms
      # 与 Python 侧 /health/ready 的 wait_for 对齐；未启用时返回 UP+disabled，不建连。
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,redis,mq,minio

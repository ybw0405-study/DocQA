# RocketMQ broker config (Docker Desktop bridge mode).
#
# Broker registers brokerIP1 + listenPort into the NameServer and clients connect to it.
# brokerIP1 必须是一个「宿主机和应用容器都能解析到 broker」的地址：
#   - 写 127.0.0.1：宿主机可用（端口映射），但应用容器连的是自己 → 20911 拒绝连接，
#     examineConsumeStats / 消息收发全挂（全容器模式 document-service readiness DOWN）。
#   - 写容器名：应用容器可用，但 Windows 宿主机解析不到 → 开发模式连不上。
# host.docker.internal 在 Docker Desktop 下两边都解析（容器内指向宿主网关），
# listenPort/VIP 已发布到 127.0.0.1，容器经宿主端口映射可绕回 broker，宿主机亦可直接连。
# 整套端口段为 DocQA 专属，可与其他本地项目并存。

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
deleteWhen = 04
fileReservedTime = 48

brokerIP1 = host.docker.internal
listenPort = 20911
namesrvAddr = rocketmq-namesrv:19876

autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
defaultTopicQueueNums = 4
retryTopicQueueNums = 2
mappedFileSizeCommitLog = 134217728
transientStorePoolEnable = false

# RocketMQ broker config (Docker Desktop bridge mode).
#
# Broker registers brokerIP1 + listenPort into the NameServer and clients connect to it.
# In bridge mode the container would register its private IP, unreachable from Windows.
# Hence brokerIP1=127.0.0.1, and listenPort=20911 plus VIP (listenPort-2=20909)
# are both published to the host. The whole range is disjoint from AgentFlow so
# both projects can run at the same time.

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
deleteWhen = 04
fileReservedTime = 48

brokerIP1 = 127.0.0.1
listenPort = 20911
namesrvAddr = rocketmq-namesrv:19876

autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
defaultTopicQueueNums = 4
retryTopicQueueNums = 2
mappedFileSizeCommitLog = 134217728
transientStorePoolEnable = false
